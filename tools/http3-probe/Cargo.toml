[package]
name = "uvicorn-rs-http3-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
bytes = "1"
futures-util = "0.3"
http = "1"
h2 = "0.4.20"
serde_json = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uvicorn-rs = { path = "../../crates/uvicorn-rs", features = ["http3"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
