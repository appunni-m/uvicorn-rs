[package]
name = "native-app-contract"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "BSD-3-Clause OR MIT"
description = "Runtime-neutral contracts for Rust-native web applications"

[lib]
name = "native_app_contract"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
