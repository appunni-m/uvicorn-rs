[package]
name = "uvicorn-rs-h3-quinn"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Jean-Christophe BEGUE <jc.begue@pm.me>", "Appunni M"]
license = "MIT"
description = "QUIC transport adapter for the uvicorn-rs HTTP/3 fork"
documentation = "https://docs.rs/uvicorn-rs-h3-quinn"
repository = "https://github.com/appunni-m/uvicorn-rs"
readme = "README.md"
keywords = ["http3", "quic", "h3"]
categories = ["network-programming", "web-programming"]
exclude = ["UPSTREAM-README.md"]

[lib]
name = "h3_quinn"

[dependencies]
bytes = "1"
futures = "0.3.28"
h3 = { package = "uvicorn-rs-h3", version = "0.1.0", path = "../uvicorn-rs-h3" }
quinn = { version = "0.11.7", default-features = false, features = ["futures-io"] }
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-util = "0.7.9"
tracing = { version = "0.1.40", optional = true }

[features]
tracing = ["dep:tracing"]
