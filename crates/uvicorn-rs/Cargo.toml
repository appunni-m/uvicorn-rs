[package]
name = "uvicorn-rs"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause OR MIT"
description = "Rust-native HTTP server library"
repository = "https://github.com/appunni-m/uvicorn-rs"
documentation = "https://docs.rs/uvicorn-rs"
readme = "README.md"
exclude = ["examples/native_core_contracts.rs"]

[lib]
name = "uvicorn_rs"

[[example]]
name = "native_core_contracts"
required-features = ["http3"]

[features]
default = []
http3 = ["dep:fastrand", "dep:futures", "dep:quinn", "dep:tokio-util", "futures-util/io"]
h3-tracing = ["http3"]

[dependencies]
bytes = "1"
data-encoding = "2.11.1"
fastrand = { version = "2.0.1", optional = true }
futures = { version = "0.3", optional = true }
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
asgi-lifespan-protocol-rs = { version = "0.2.2", path = "../asgi-lifespan-protocol-rs" }
pin-project-lite = "0.2"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "service", "tokio"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
yawc = { version = "=0.5.0", default-features = false, features = ["tls"] }
quinn = { version = "0.11", default-features = false, features = ["futures-io", "runtime-tokio", "rustls-ring"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tower-service = "0.3"
tracing = "0.1"

[dev-dependencies]
assert_matches = "1.5.0"
h2 = "0.4"
hyper = { version = "1", features = ["client"] }
proptest = "1"
quinn-proto = { version = "0.11", default-features = false }
socket2 = "0.6"
serde_json = "1"
rustls-pemfile = "2"
tokio = { version = "1", features = ["signal"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
