[package]
name = "uvicorn-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause OR MIT"
description = "Rust-native HTTP server library"
repository = "https://github.com/appunni-m/uvicorn-rs"
documentation = "https://docs.rs/uvicorn-rs"
readme = "README.md"
exclude = ["examples/native_core_contracts.rs"]

[lib]
name = "uvicorn_rs"

[features]
runtime-diagnostics = ["dep:socket2"]

[dependencies]
bytes = "1"
data-encoding = "2.11.1"
futures-util = "0.3"
h3 = { package = "uvicorn-rs-h3", version = "0.1.0", path = "../uvicorn-rs-h3" }
h3-quinn = { package = "uvicorn-rs-h3-quinn", version = "0.1.0", path = "../uvicorn-rs-h3-quinn" }
http = "1"
http-body = "1"
http-body-util = "0.1"
native-app-contract = { version = "0.1.0", path = "../native-app-contract" }
pin-project-lite = "0.2"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "service", "tokio"] }
socket2 = { version = "0.6", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tower-service = "0.3"
tracing = "0.1"

[dev-dependencies]
h2 = "0.4"
hyper = { version = "1", features = ["client"] }
quinn-proto = { version = "0.11", default-features = false }
serde_json = "1"
rustls-pemfile = "2"
tokio = { version = "1", features = ["signal"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
