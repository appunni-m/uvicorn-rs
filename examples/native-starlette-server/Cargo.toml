[package]
name = "uvicorn-rs-starlette-native-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
bytes = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
starlette-rs = { path = "../../../starlette-rs/starlette-rs" }
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
uvicorn-rs = { path = "../../crates/uvicorn-rs" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace]
