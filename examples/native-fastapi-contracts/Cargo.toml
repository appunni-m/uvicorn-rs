[package]
name = "uvicorn-rs-fastapi-native-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
bytes = "1"
fastapi-rs-native = { path = "../../../fastapi-rs/fastapi-rs-native", features = ["uvicorn-rs"] }
futures-util = "0.3"
h2 = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "http1", "http2", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
uvicorn-rs = { path = "../../crates/uvicorn-rs" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace]
