[package]
name = "uvicorn-rs-py"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
publish = false
license = "BSD-3-Clause OR MIT"
description = "Python ASGI adapter for the Rust-native Uvicorn-RS server"
repository = "https://github.com/appunni-m/uvicorn-rs"
readme = "README.md"

[workspace]
members = [
    "crates/asgi-lifespan-protocol-rs",
    "crates/uvicorn-rs",
    "tools/http3-probe",
]
default-members = [".", "crates/uvicorn-rs"]
resolver = "3"

[patch.crates-io]
hyper = { path = "crates/uvicorn-rs/third-party/hyper" }

[lib]
name = "uvicorn_rs"
crate-type = ["cdylib"]

[features]
runtime-diagnostics = []

[dependencies]
aes = "0.9"
base64 = "0.22"
bytes = "1"
cbc = "0.2"
des = { version = "0.9", features = ["zeroize"] }
fastrand = "2.0.1"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "tokio"] }
md-5 = { version = "0.11", default-features = false }
percent-encoding = "2"
pyo3 = { version = "0.29", features = ["abi3-py39", "bytes", "extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pkcs8 = { version = "0.11", features = ["encryption", "pem", "sha1-insecure", "std"] }
rustls-pemfile = "2"
sha1 = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"
uvicorn-rs = { version = "0.2.2", path = "crates/uvicorn-rs", features = ["http3"] }
tower-service = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "net"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
