[package]
name = "uvicorn-rs-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "BSD-3-Clause OR MIT"
description = "Python ASGI adapter for the Rust-native Uvicorn-RS server"
repository = "https://github.com/appunni-m/uvicorn-rs"
readme = "README.md"

[workspace]
members = [
    "crates/native-app-contract",
    "crates/uvicorn-rs",
    "crates/uvicorn-rs-h3",
    "crates/uvicorn-rs-h3-quinn",
    "tools/http3-probe",
]
default-members = [".", "crates/uvicorn-rs"]
resolver = "2"

[lib]
name = "uvicorn_rs"
crate-type = ["cdylib"]

[features]
default = ["native-tcp"]
runtime-diagnostics = []
native-tcp = []

[dependencies]
bytes = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
h3 = { package = "uvicorn-rs-h3", version = "0.1.0", path = "crates/uvicorn-rs-h3" }
h3-quinn = { package = "uvicorn-rs-h3-quinn", version = "0.1.0", path = "crates/uvicorn-rs-h3-quinn" }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "tokio"] }
percent-encoding = "2"
pyo3 = { version = "0.29", features = ["abi3-py39", "bytes", "extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
uvicorn-rs = { version = "0.1.0", path = "crates/uvicorn-rs" }
tower-service = "0.3"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
