[package]
name = "uvicorn-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false
description = "Rust network runtime for Python ASGI applications"
repository = "https://github.com/appunni-m/uvicorn-rs"
readme = "README.md"

[lib]
name = "uvicorn_rs"
crate-type = ["cdylib", "rlib"]

[features]
runtime-diagnostics = []

[dependencies]
bytes = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "tokio"] }
percent-encoding = "2"
pyo3 = { version = "0.29", features = ["abi3-py39", "bytes", "extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
correctness = "deny"
