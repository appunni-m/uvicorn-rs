[loggers]
keys=root,uvicorn.error,uvicorn.access

[handlers]
keys=stderr

[formatters]
keys=parity

[logger_root]
level=DEBUG
handlers=stderr

[logger_uvicorn.error]
level=DEBUG
handlers=stderr
qualname=uvicorn.error
propagate=0

[logger_uvicorn.access]
level=DEBUG
handlers=stderr
qualname=uvicorn.access
propagate=0

[handler_stderr]
class=StreamHandler
level=DEBUG
formatter=parity
args=(sys.stderr,)

[formatter_parity]
format=PARITY %(levelname)s %(name)s: %(message)s
