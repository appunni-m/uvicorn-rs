name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag with a verified candidate artifact
        required: true
        type: string
      action:
        description: Prepare only, or publish selected registries after all gates pass
        required: true
        default: prepare-only
        type: choice
        options:
          - prepare-only
          - cargo
          - pypi
          - cargo-and-pypi
      confirmation:
        description: For publication, enter exactly PUBLISH vX.Y.Z
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify the exact candidate and registry state
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
      run-id: ${{ steps.candidate.outputs.run-id }}
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
      artifact-digest: ${{ steps.candidate.outputs.artifact-digest }}
      publish-contract: ${{ steps.registry.outputs.publish-contract }}
      publish-h3: ${{ steps.registry.outputs.publish-h3 }}
      publish-h3-quinn: ${{ steps.registry.outputs.publish-h3-quinn }}
      publish-uvicorn-rs: ${{ steps.registry.outputs.publish-uvicorn-rs }}
      publish-pypi: ${{ steps.registry.outputs.publish-pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
      - name: Verify the annotated tag, main ancestry, versions and explicit authorization
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          tag_object="$(git rev-parse "$RELEASE_TAG")"
          remote_tag_object="$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 {print $1}')"
          test -n "$remote_tag_object"
          test "$remote_tag_object" = "$tag_object"
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
          python scripts/check_release_version.py "$version"
          if [[ "$RELEASE_ACTION" != prepare-only ]]; then
            test "$RELEASE_CONFIRMATION" = "PUBLISH $RELEASE_TAG"
          fi
          echo "tag-object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Locate the one successful release-candidate run for this tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["RELEASE_COMMIT"]
          token = os.environ["GH_TOKEN"]

          def get(path):
              request = Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers={"Accept": "application/vnd.github+json",
                           "Authorization": f"Bearer {token}",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          runs = get("actions/workflows/release.yml/runs?per_page=100").get("workflow_runs", [])
          candidates = []
          artifact_name = f"uvicorn-rs-candidate-{tag}"
          for run in runs:
              if (run.get("head_sha") != commit or run.get("event") != "push"
                      or run.get("status") != "completed" or run.get("conclusion") != "success"):
                  continue
              run_id = run.get("id")
              if type(run_id) is not int or run_id <= 0:
                  continue
              artifacts = get(f"actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
              matches = [item for item in artifacts
                         if item.get("name") == artifact_name and item.get("expired") is False]
              if len(matches) != 1:
                  continue
              artifact = matches[0]
              digest = artifact.get("digest")
              if (type(artifact.get("id")) is not int or artifact["id"] <= 0
                      or not isinstance(digest, str)
                      or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None):
                  continue
              candidates.append((run, artifact))

          if len(candidates) != 1:
              raise SystemExit(
                  f"expected one successful, retained {artifact_name} artifact for {commit}; "
                  f"found {len(candidates)}"
              )
          run, artifact = candidates[0]
          values = {
              "tag": tag,
              "commit": commit,
              "version": tag.removeprefix("v"),
              "run-id": run["id"],
              "artifact-id": artifact["id"],
              "artifact-digest": artifact["digest"],
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY
      - name: Download the exact candidate artifact and verify its digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          artifact-ids: ${{ steps.candidate.outputs.artifact-id }}
          digest-mismatch: error
          path: target/release-candidate
      - name: Verify candidate checksums, source and package consumers
        env:
          RELEASE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          cd target/release-candidate
          sha256sum --check --strict SHA256SUMS
          cd ../..
          python - "$RELEASE_VERSION" "$RELEASE_COMMIT" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          version, commit = sys.argv[1:]
          candidate = json.loads(Path("target/release-candidate/candidate.json").read_text())
          if (candidate.get("schema") != "uvicorn-rs-release-candidate@2"
                  or candidate.get("state") != "verified candidate; publication disabled"
                  or candidate.get("version") != version
                  or candidate.get("commit") != commit
                  or candidate.get("tag") != f"v{version}"):
              raise SystemExit("candidate manifest does not bind the requested tag, version and source commit")

          root = Path("target/release-candidate/evidence")
          receipt_path = root / "standalone-h3-consumer.json"
          cargo_requested = os.environ["RELEASE_ACTION"] in {"cargo", "cargo-and-pypi"}
          if cargo_requested and receipt_path.is_file():
              receipt = json.loads(receipt_path.read_text())
              archive = Path("target/release-candidate/packages") / f"uvicorn-rs-{version}.crate"
              import hashlib
              archive_sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
              required = {
                  "schema": "uvicorn-rs-standalone-h3-consumer@1",
                  "status": "passed",
                  "source_commit": commit,
                  "source_dirty": False,
                  "crate_sha256": archive_sha256,
                  "archive_sha256s": {
                      f"{package}-{version}.crate": hashlib.sha256(
                          (Path("target/release-candidate/packages") / f"{package}-{version}.crate").read_bytes()
                      ).hexdigest()
                      for package in ("native-app-contract", "uvicorn-rs-h3", "uvicorn-rs-h3-quinn", "uvicorn-rs")
                  },
                  "input_case_id": "http3.truncated-data-frame-recovery-after-protocol-error",
                  "registry_dependencies": ["native-app-contract", "uvicorn-rs-h3", "uvicorn-rs-h3-quinn"],
                  "dependency_source": "exact-candidate-crate-archives",
                  "workspace_h3_patch": False,
                  "expected_h3_error_code": 262,
                  "observed_h3_error_code": 262,
                  "follow_up_connection_reused": False,
                  "follow_up_request_status": 200,
              }
              if any(receipt.get(key) != value for key, value in required.items()):
                  raise SystemExit("standalone H3 consumer receipt is incomplete or mismatched")
          elif cargo_requested and os.environ["RELEASE_ACTION"] != "prepare-only":
              raise SystemExit("publication is blocked: exact-archive standalone H3 consumer evidence is missing")
          elif not cargo_requested and os.environ["RELEASE_ACTION"] != "prepare-only":
              print("Cargo was not selected; standalone H3 archive evidence is not a PyPI gate")
          PY
          rm -rf target/publication-recheck
          mkdir -p target/publication-recheck/packages target/publication-recheck/evidence
          cp -R target/release-candidate/packages/. target/publication-recheck/packages/
          cp -R target/release-candidate/evidence/. target/publication-recheck/evidence/
          python scripts/verify_release_candidate.py \
            target/publication-recheck/packages "$RELEASE_VERSION" "$RELEASE_COMMIT" \
            --evidence-directory target/publication-recheck/evidence
      - name: Check immutable registry versions without credentials
        id: registry
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          action = os.environ["RELEASE_ACTION"]
          version = os.environ["RELEASE_VERSION"]
          root = Path("target/release-candidate")
          packages = root / "packages"
          crate_names = (
              "native-app-contract", "uvicorn-rs-h3", "uvicorn-rs-h3-quinn", "uvicorn-rs",
          )

          def remote_json(url, user_agent):
              request = Request(url, headers={"User-Agent": user_agent, "Accept": "application/json"})
              try:
                  with urlopen(request, timeout=30) as response:
                      return response.status, json.load(response)
              except HTTPError as error:
                  if error.code == 404:
                      return 404, None
                  raise

          def check_crate(name):
              archive = packages / f"{name}-{version}.crate"
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              status, payload = remote_json(
                  f"https://crates.io/api/v1/crates/{name}/{version}",
                  "uvicorn-rs-release-preflight",
              )
              if status == 404:
                  return True
              actual = payload.get("version", {}).get("checksum") if payload else None
              if actual != digest:
                  raise SystemExit(f"crates.io already contains {name} {version} with different bytes")
              return False

          def check_pypi():
              expected = {}
              for path in packages.iterdir():
                  if path.suffix == ".whl" or path.name.endswith(".tar.gz"):
                      expected[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
              if len(expected) != 4:
                  raise SystemExit(f"expected exactly three wheels and one sdist, found {len(expected)}")
              status, payload = remote_json(
                  f"https://pypi.org/pypi/uvicorn-rs-py/{version}/json",
                  "uvicorn-rs-release-preflight",
              )
              if status == 404:
                  return True
              files = payload.get("urls", []) if payload else []
              actual = {item.get("filename"): item.get("digests", {}).get("sha256") for item in files}
              if actual != expected:
                  raise SystemExit("PyPI already contains this version with a partial or different distribution set")
              return False

          publish_contract = publish_h3 = publish_h3_quinn = publish_server = publish_pypi = False
          if action in {"cargo", "cargo-and-pypi"}:
              publish_contract = check_crate(crate_names[0])
              publish_h3 = check_crate(crate_names[1])
              publish_h3_quinn = check_crate(crate_names[2])
              publish_server = check_crate(crate_names[3])
          if action in {"pypi", "cargo-and-pypi"}:
              publish_pypi = check_pypi()
          if action == "prepare-only":
              print("prepare-only: registry checks were not requested; no publisher jobs will run")
          values = {
              "publish-contract": str(publish_contract).lower(),
              "publish-h3": str(publish_h3).lower(),
              "publish-h3-quinn": str(publish_h3_quinn).lower(),
              "publish-uvicorn-rs": str(publish_server).lower(),
              "publish-pypi": str(publish_pypi).lower(),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY

  publish-contract:
    name: Publish native-app-contract to crates.io
    needs: prepare
    if: needs.prepare.outputs.publish-contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.85.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.run-id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          digest-mismatch: error
          path: target/release-candidate
      - name: Verify package identity and exact archive bytes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd target/release-candidate
          sha256sum --check --strict SHA256SUMS
          cd ../..
          cargo package -p native-app-contract --no-verify --locked
          cmp "target/package/native-app-contract-$RELEASE_VERSION.crate" \
            "target/release-candidate/packages/native-app-contract-$RELEASE_VERSION.crate"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the exact reviewed crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Candidate CI checked the packaged archive in a clean consumer. This
        # job repacks it and compares exact bytes before requesting OIDC; skip
        # repeating that build after the short-lived credential is available.
        run: cargo publish -p native-app-contract --no-verify --locked

  publish-h3:
    name: Publish uvicorn-rs-h3 to crates.io
    needs: [prepare, publish-contract]
    if: >-
      !cancelled() && needs.prepare.outputs.publish-h3 == 'true' &&
      (needs.publish-contract.result == 'success' || needs.publish-contract.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.85.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.run-id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          digest-mismatch: error
          path: target/release-candidate
      - name: Verify package identity and exact archive bytes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd target/release-candidate
          sha256sum --check --strict SHA256SUMS
          cd ../..
          cargo package -p uvicorn-rs-h3 --no-verify --locked
          cmp "target/package/uvicorn-rs-h3-$RELEASE_VERSION.crate" \
            "target/release-candidate/packages/uvicorn-rs-h3-$RELEASE_VERSION.crate"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the exact reviewed crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p uvicorn-rs-h3 --no-verify --locked

  publish-h3-quinn:
    name: Publish uvicorn-rs-h3-quinn to crates.io
    needs: [prepare, publish-contract, publish-h3]
    if: >-
      !cancelled() && needs.prepare.outputs.publish-h3-quinn == 'true' &&
      (needs.publish-contract.result == 'success' || needs.publish-contract.result == 'skipped') &&
      (needs.publish-h3.result == 'success' || needs.publish-h3.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.85.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.run-id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          digest-mismatch: error
          path: target/release-candidate
      - name: Verify package identity and exact archive bytes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd target/release-candidate
          sha256sum --check --strict SHA256SUMS
          cd ../..
          cargo package -p uvicorn-rs-h3-quinn --no-verify --locked \
            --config 'patch.crates-io.uvicorn-rs-h3.path="crates/uvicorn-rs-h3"'
          cmp "target/package/uvicorn-rs-h3-quinn-$RELEASE_VERSION.crate" \
            "target/release-candidate/packages/uvicorn-rs-h3-quinn-$RELEASE_VERSION.crate"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the exact reviewed crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p uvicorn-rs-h3-quinn --no-verify --locked

  publish-uvicorn-rs:
    name: Publish uvicorn-rs to crates.io
    needs: [prepare, publish-contract, publish-h3, publish-h3-quinn]
    if: >-
      !cancelled() && needs.prepare.outputs.publish-uvicorn-rs == 'true' &&
      (needs.publish-contract.result == 'success' || needs.publish-contract.result == 'skipped') &&
      (needs.publish-h3.result == 'success' || needs.publish-h3.result == 'skipped') &&
      (needs.publish-h3-quinn.result == 'success' || needs.publish-h3-quinn.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.85.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.run-id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          digest-mismatch: error
          path: target/release-candidate
      - name: Verify package identity and exact archive bytes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd target/release-candidate
          sha256sum --check --strict SHA256SUMS
          cd ../..
          cargo package -p uvicorn-rs --no-verify --locked \
            --config 'patch.crates-io.native-app-contract.path="crates/native-app-contract"' \
            --config 'patch.crates-io.uvicorn-rs-h3.path="crates/uvicorn-rs-h3"' \
            --config 'patch.crates-io.uvicorn-rs-h3-quinn.path="crates/uvicorn-rs-h3-quinn"'
          cmp "target/package/uvicorn-rs-$RELEASE_VERSION.crate" \
            "target/release-candidate/packages/uvicorn-rs-$RELEASE_VERSION.crate"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the exact reviewed crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Candidate CI checked the packaged archive in a clean consumer. This
        # job repacks it and compares exact bytes before requesting OIDC; skip
        # repeating that build after the short-lived credential is available.
        run: >-
          cargo publish -p uvicorn-rs --no-verify --locked
          --config 'patch.crates-io.native-app-contract.path="crates/native-app-contract"'

  publish-pypi:
    name: Publish uvicorn-rs-py to PyPI
    needs: prepare
    if: needs.prepare.outputs.publish-pypi == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.run-id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          digest-mismatch: error
          path: target/release-candidate
      - name: Stage only the four verified Python distributions
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd target/release-candidate
          sha256sum --check --strict SHA256SUMS
          cd packages
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp -- *.whl "uvicorn_rs_py-$RELEASE_VERSION.tar.gz" "$GITHUB_WORKSPACE/dist/"
          test "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
      - name: Publish the reviewed distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  verify-publication:
    name: Verify registry bytes against the candidate
    needs:
      - prepare
      - publish-contract
      - publish-h3
      - publish-h3-quinn
      - publish-uvicorn-rs
      - publish-pypi
    if: >-
      !cancelled() && inputs.action != 'prepare-only' &&
      needs.prepare.result == 'success' &&
      (needs.publish-contract.result == 'success' || needs.publish-contract.result == 'skipped') &&
      (needs.publish-h3.result == 'success' || needs.publish-h3.result == 'skipped') &&
      (needs.publish-h3-quinn.result == 'success' || needs.publish-h3-quinn.result == 'skipped') &&
      (needs.publish-uvicorn-rs.result == 'success' || needs.publish-uvicorn-rs.result == 'skipped') &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.run-id }}
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          digest-mismatch: error
          path: target/release-candidate
      - name: Confirm published registry checksums match the candidate
        env:
          RELEASE_ACTION: ${{ inputs.action }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          action = os.environ["RELEASE_ACTION"]
          version = os.environ["RELEASE_VERSION"]
          packages = Path("target/release-candidate/packages")

          def remote_json(url):
              request = Request(url, headers={
                  "User-Agent": "uvicorn-rs-release-verification",
                  "Accept": "application/json",
              })
              try:
                  with urlopen(request, timeout=20) as response:
                      return json.load(response)
              except HTTPError as error:
                  if error.code == 404:
                      return None
                  raise

          def check_registry(check, description):
              last_error = None
              for attempt in range(12):
                  try:
                      check()
                      print(f"verified {description}")
                      return
                  except LookupError as error:
                      last_error = error
                      if attempt < 11:
                          time.sleep(10)
              raise SystemExit(f"registry did not expose {description}: {last_error}")

          def verify_crate(name):
              archive = packages / f"{name}-{version}.crate"
              expected = hashlib.sha256(archive.read_bytes()).hexdigest()
              payload = remote_json(f"https://crates.io/api/v1/crates/{name}/{version}")
              actual = payload.get("version", {}).get("checksum") if payload else None
              if actual is None:
                  raise LookupError(f"{name} {version} not visible yet")
              if actual != expected:
                  raise SystemExit(f"published {name} checksum differs from the candidate")

          def verify_pypi():
              expected = {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in packages.iterdir()
                  if path.suffix == ".whl" or path.name.endswith(".tar.gz")
              }
              payload = remote_json(f"https://pypi.org/pypi/uvicorn-rs-py/{version}/json")
              if payload is None:
                  raise LookupError(f"uvicorn-rs-py {version} not visible yet")
              actual = {
                  item.get("filename"): item.get("digests", {}).get("sha256")
                  for item in payload.get("urls", [])
              }
              if actual != expected:
                  raise SystemExit("published PyPI files differ from the candidate filenames or checksums")

          if action in {"cargo", "cargo-and-pypi"}:
              for crate in (
                  "native-app-contract", "uvicorn-rs-h3", "uvicorn-rs-h3-quinn", "uvicorn-rs",
              ):
                  check_registry(lambda crate=crate: verify_crate(crate), f"{crate} {version}")
          if action in {"pypi", "cargo-and-pypi"}:
              check_registry(verify_pypi, f"uvicorn-rs-py {version}")
          PY
