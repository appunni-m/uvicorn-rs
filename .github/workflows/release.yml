# Assemble artifacts from successful main CI on the exact annotated tag commit.
# Registry publication, public GitHub Releases and tag mutation remain disabled.
name: Release candidate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.13"

jobs:
  candidate:
    name: Verify immutable tag, exact CI evidence and package bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify remote annotated tag and synchronized versions
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          object_type="$(jq -r '.object.type' <<< "$tag_json")"
          object_sha="$(jq -r '.object.sha' <<< "$tag_json")"
          test "$object_type" = tag
          [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]
          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object | select(.type == "commit") | .sha')"
          commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$commit"
          # Validate the remote object even if checkout only materialized its
          # peeled commit. Never create or move a tag to repair verification.
          version="${GITHUB_REF_NAME#v}"
          python scripts/check_release_version.py "$version"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag-object-sha=$object_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require successful complete main CI for this exact commit
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          selection="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_COMMIT}&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | sort_by(.updated_at) | last | select(. != null) | [.id, .run_attempt] | @tsv')"
          IFS=$'\t' read -r run_id run_attempt <<< "$selection"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          [[ "$run_attempt" =~ ^[0-9]+$ ]]
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run-attempt=$run_attempt" >> "$GITHUB_OUTPUT"
      - name: Select exact successful performance matrix and retained artifact
        id: performance-run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["RELEASE_COMMIT"]

          def api(path):
              result = subprocess.run(["gh", "api", path], check=True, capture_output=True, text=True)
              return json.loads(result.stdout)

          endpoint = (f"repos/{repository}/actions/workflows/benchmark-categories.yml/runs"
                      f"?head_sha={commit}&per_page=100")
          runs = api(endpoint).get("workflow_runs", [])
          runs = sorted(
              (run for run in runs if run.get("head_sha") == commit and run.get("event") == "push"
               and run.get("head_branch") == "main" and run.get("status") == "completed"
               and type(run.get("run_attempt")) is int and run["run_attempt"] > 0),
              key=lambda run: run.get("updated_at", ""), reverse=True)
          required_jobs = {
              "linux-x86_64 · parity and sequential categories",
              "linux-aarch64 · parity and sequential categories",
              "macos-arm64 · parity and sequential categories",
              "Validate and render the multi-system evidence",
          }
          rejected = []
          selected = None
          for run in runs:
              run_id = run.get("id")
              attempt = run["run_attempt"]
              jobs = api(f"repos/{repository}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100").get("jobs", [])
              successful = {job.get("name") for job in jobs
                            if job.get("status") == "completed" and job.get("conclusion") == "success"}
              if not required_jobs <= successful:
                  rejected.append(f"{run_id}/{attempt}: required category or aggregate job failed")
                  continue
              artifacts = api(f"repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
              expected_name = f"asgi-benchmark-matrix-{run_id}-{attempt}"
              matches = [artifact for artifact in artifacts
                         if artifact.get("name") == expected_name and artifact.get("expired") is False]
              if len(matches) != 1:
                  rejected.append(f"{run_id}/{attempt}: exact aggregate artifact is missing, expired, or duplicated")
                  continue
              artifact = matches[0]
              digest = artifact.get("digest")
              size = artifact.get("size_in_bytes")
              if (type(artifact.get("id")) is not int or artifact["id"] <= 0
                      or type(size) is not int or size <= 0
                      or not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None):
                  rejected.append(f"{run_id}/{attempt}: aggregate artifact metadata is incomplete")
                  continue
              selected = {"run-id": run_id, "run-attempt": attempt,
                          "artifact-id": artifact["id"], "artifact-name": expected_name,
                          "artifact-size": size, "artifact-digest": digest}
              break

          if selected is None:
              detail = "; ".join(rejected[:8]) or "no completed exact-commit benchmark run was found"
              raise SystemExit(f"no successful exact-commit three-system performance evidence: {detail}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in selected.items():
                  output.write(f"{key}={value}\n")
          print(json.dumps(selected, sort_keys=True))
          PY
      - name: Download the exact retained performance artifact by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.performance-run.outputs.run-id }}
          artifact-ids: ${{ steps.performance-run.outputs.artifact-id }}
          path: target/release-candidate/evidence/performance
          digest-mismatch: error
      - name: Download package artifacts from exact successful main CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run-id }}
          pattern: uvicorn-rs-candidate-*
          merge-multiple: true
          path: target/release-candidate/packages
      - name: Download normal public parity and seam-exclusion evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run-id }}
          name: uvicorn-rs-public-parity
          path: target/release-candidate/evidence/public
      - name: Download complete unified native coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run-id }}
          name: uvicorn-rs-unified-coverage
          path: target/release-candidate/evidence/coverage
      - name: Download Python minimum consumer evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run-id }}
          name: uvicorn-rs-python-floor
          path: target/release-candidate/evidence/python-floor
      - name: Verify Python packages, native Rust crates and exact artifact identities
        env:
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: >-
          python scripts/verify_release_candidate.py target/release-candidate/packages
          "$RELEASE_VERSION" "$RELEASE_COMMIT"
          --evidence-directory target/release-candidate/evidence
      - name: Enforce exact-source performance acceptance
        env:
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          PERFORMANCE_RUN_ID: ${{ steps.performance-run.outputs.run-id }}
          PERFORMANCE_RUN_ATTEMPT: ${{ steps.performance-run.outputs.run-attempt }}
          PERFORMANCE_ARTIFACT_ID: ${{ steps.performance-run.outputs.artifact-id }}
          PERFORMANCE_ARTIFACT_NAME: ${{ steps.performance-run.outputs.artifact-name }}
          PERFORMANCE_ARTIFACT_SIZE: ${{ steps.performance-run.outputs.artifact-size }}
          PERFORMANCE_ARTIFACT_DIGEST: ${{ steps.performance-run.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          native_sha="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("target/release-candidate/evidence/public/normal-audit/receipt.json").read_text())["native_extension_sha256"])')"
          python scripts/verify_performance_acceptance.py \
            target/release-candidate/evidence/performance \
            docs/performance-acceptance.json \
            --repository "$GITHUB_REPOSITORY" \
            --expected-commit "$RELEASE_COMMIT" \
            --run-id "$PERFORMANCE_RUN_ID" \
            --run-attempt "$PERFORMANCE_RUN_ATTEMPT" \
            --artifact-id "$PERFORMANCE_ARTIFACT_ID" \
            --artifact-name "$PERFORMANCE_ARTIFACT_NAME" \
            --artifact-size "$PERFORMANCE_ARTIFACT_SIZE" \
            --artifact-digest "$PERFORMANCE_ARTIFACT_DIGEST" \
            --expected-native-sha256 "$native_sha" \
            --receipt target/release-candidate/performance-acceptance.json
      - name: Recheck retained complete coverage and parity evidence
        run: |
          python scripts/check_ci_evidence.py coverage target/release-candidate/evidence/coverage/coverage-report.json --offline --require-clean
          python scripts/check_ci_evidence.py parity target/release-candidate/evidence/public/asgi-parity/result.json --offline --require-clean
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed Rust toolchain action
        with:
          toolchain: "1.85.0"
      - name: Build the extracted Cargo archives as a standalone HTTP/3 consumer
        env:
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: >-
          python scripts/run_standalone_h3_consumer.py
          target/release-candidate/packages "$RELEASE_VERSION" "$RELEASE_COMMIT"
          target/release-candidate/evidence/standalone-h3-consumer.json
      - name: Confirm CI was not rerun during candidate assembly
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          RELEASE_CI_RUN: ${{ steps.ci-run.outputs.run-id }}
          RELEASE_CI_ATTEMPT: ${{ steps.ci-run.outputs.run-attempt }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_CI_RUN}" > "$RUNNER_TEMP/uvicorn-rs-ci-run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          run = json.loads((Path(os.environ["RUNNER_TEMP"]) / "uvicorn-rs-ci-run.json").read_text())
          expected = {"id": int(os.environ["RELEASE_CI_RUN"]), "run_attempt": int(os.environ["RELEASE_CI_ATTEMPT"]),
                      "head_sha": os.environ["RELEASE_COMMIT"], "event": "push", "head_branch": "main",
                      "status": "completed", "conclusion": "success"}
          if any(run.get(key) != value for key, value in expected.items()):
              raise SystemExit("CI identity/status changed during candidate assembly")
          PY
      - name: Revalidate the selected performance run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          PERFORMANCE_RUN_ID: ${{ steps.performance-run.outputs.run-id }}
          PERFORMANCE_RUN_ATTEMPT: ${{ steps.performance-run.outputs.run-attempt }}
          PERFORMANCE_ARTIFACT_ID: ${{ steps.performance-run.outputs.artifact-id }}
          PERFORMANCE_ARTIFACT_NAME: ${{ steps.performance-run.outputs.artifact-name }}
          PERFORMANCE_ARTIFACT_SIZE: ${{ steps.performance-run.outputs.artifact-size }}
          PERFORMANCE_ARTIFACT_DIGEST: ${{ steps.performance-run.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]

          def api(path):
              result = subprocess.run(["gh", "api", path], check=True, capture_output=True, text=True)
              return json.loads(result.stdout)

          run_id = os.environ["PERFORMANCE_RUN_ID"]
          attempt = int(os.environ["PERFORMANCE_RUN_ATTEMPT"])
          run = api(f"repos/{repository}/actions/runs/{run_id}")
          expected_run = {"id": int(run_id), "run_attempt": attempt,
                          "head_sha": os.environ["RELEASE_COMMIT"], "event": "push",
                          "head_branch": "main", "status": "completed"}
          if any(run.get(key) != value for key, value in expected_run.items()):
              raise SystemExit("selected performance run identity changed during candidate assembly")

          jobs = api(f"repos/{repository}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100").get("jobs", [])
          expected_jobs = {
              "linux-x86_64 · parity and sequential categories",
              "linux-aarch64 · parity and sequential categories",
              "macos-arm64 · parity and sequential categories",
              "Validate and render the multi-system evidence",
          }
          successful = {job.get("name") for job in jobs
                        if job.get("status") == "completed" and job.get("conclusion") == "success"}
          if not expected_jobs <= successful:
              raise SystemExit("selected performance run no longer has successful platform and aggregate jobs")

          artifacts = api(f"repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
          matches = [item for item in artifacts if item.get("id") == int(os.environ["PERFORMANCE_ARTIFACT_ID"])]
          expected_artifact = {
              "name": os.environ["PERFORMANCE_ARTIFACT_NAME"],
              "size_in_bytes": int(os.environ["PERFORMANCE_ARTIFACT_SIZE"]),
              "digest": os.environ["PERFORMANCE_ARTIFACT_DIGEST"],
              "expired": False,
          }
          if len(matches) != 1 or any(matches[0].get(key) != value for key, value in expected_artifact.items()):
              raise SystemExit("selected performance artifact metadata changed during candidate assembly")
          print(json.dumps({"run_id": run_id, "run_attempt": attempt,
                            "artifact_id": matches[0]["id"], "digest": matches[0]["digest"]}, sort_keys=True))
          PY
      - name: Bind the assembled bundle to the successful CI run
        env:
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_TAG_OBJECT: ${{ steps.tag.outputs.tag-object-sha }}
          RELEASE_CI_RUN: ${{ steps.ci-run.outputs.run-id }}
          RELEASE_CI_ATTEMPT: ${{ steps.ci-run.outputs.run-attempt }}
          PERFORMANCE_RUN_ID: ${{ steps.performance-run.outputs.run-id }}
          PERFORMANCE_RUN_ATTEMPT: ${{ steps.performance-run.outputs.run-attempt }}
          PERFORMANCE_ARTIFACT_ID: ${{ steps.performance-run.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path("target/release-candidate")
          performance_path = root / "performance-acceptance.json"
          performance = json.loads(performance_path.read_text())
          if (performance.get("status") != "verified"
                  or performance.get("workflow_run_id") != os.environ["PERFORMANCE_RUN_ID"]
                  or performance.get("workflow_run_attempt") != int(os.environ["PERFORMANCE_RUN_ATTEMPT"])
                  or performance.get("artifact_id") != int(os.environ["PERFORMANCE_ARTIFACT_ID"])):
              raise SystemExit("performance receipt differs from the selected exact-run artifact")
          record = {"schema": "uvicorn-rs-release-candidate@2", "state": "verified candidate; publication disabled",
                    "commit": os.environ["RELEASE_COMMIT"], "version": os.environ["RELEASE_VERSION"],
                    "ci_run_id": os.environ["RELEASE_CI_RUN"], "ci_run_attempt": os.environ["RELEASE_CI_ATTEMPT"],
                    "tag": os.environ["GITHUB_REF_NAME"],
                    "tag_object_sha": os.environ["RELEASE_TAG_OBJECT"],
                    "performance": {"decision": performance["decision"],
                                    "receipt_sha256": hashlib.sha256(performance_path.read_bytes()).hexdigest(),
                                    "review_sha256": performance["review_sha256"],
                                    "workflow_run_id": performance["workflow_run_id"],
                                    "workflow_run_attempt": performance["workflow_run_attempt"],
                                    "artifact_id": performance["artifact_id"],
                                    "artifact_tree_sha256": performance["artifact_tree_sha256"]}}
          (root / "candidate.json").write_text(json.dumps(record, indent=2) + "\n")
          files = sorted(path for path in root.rglob("*") if path.is_file())
          (root / "SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}\n"
              for path in files))
          PY
      - name: Revalidate the remote annotated tag immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
          RELEASE_TAG_OBJECT: ${{ steps.tag.outputs.tag-object-sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          object_type="$(jq -r '.object.type' <<< "$tag_json")"
          object_sha="$(jq -r '.object.sha' <<< "$tag_json")"
          test "$object_type" = tag
          test "$object_sha" = "$RELEASE_TAG_OBJECT"
          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object | select(.type == "commit") | .sha')"
          test "$tag_commit" = "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uvicorn-rs-candidate-${{ github.ref_name }}
          path: target/release-candidate/
          if-no-files-found: error
          retention-days: 90
