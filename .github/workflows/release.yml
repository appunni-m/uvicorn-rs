# This workflow verifies a tagged candidate and retains CI artifacts only.
# Registry publication and public GitHub Releases are intentionally disabled.

name: Release candidate

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.13"

jobs:
  candidate:
    name: Verify tag and retain exact-CI artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require an annotated tag for the checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{commit}")" = "$(git rev-parse HEAD)"
          python scripts/check_release_version.py "${GITHUB_REF_NAME#v}"
      - name: Require successful main CI for this exact commit
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | sort_by(.updated_at) | last | .id // empty')"
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download artifacts from that successful main CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run-id }}
          pattern: uvicorn-rs-candidate-*
          merge-multiple: true
          path: target/release-candidate
      - name: Verify candidate contents and write checksums
        run: python scripts/verify_release_candidate.py target/release-candidate "${GITHUB_REF_NAME#v}" "${GITHUB_SHA}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uvicorn-rs-candidate-${{ github.ref_name }}
          path: target/release-candidate/
          if-no-files-found: error
          retention-days: 90
