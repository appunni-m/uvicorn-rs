            --output target/benchmark-preparation/host-preflight.json
      - name: Run one normal-build FastAPI workload against Uvicorn
        shell: bash
        env:
          BENCHMARK_FASTAPI_WORKLOAD: ${{ inputs.fastapi_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-workload=fastapi-upload-1m-write-1k]') && 'fastapi-upload-1m-write-1k') || 'fastapi-validated-route' }}
          BENCHMARK_DURATION: ${{ inputs.duration || '5' }}
          BENCHMARK_WARMUP: ${{ inputs.warmup || '1' }}
          BENCHMARK_CONCURRENCY: ${{ inputs.concurrency || '64' }}
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '5' }}
          BENCHMARK_SEED: ${{ inputs.seed || '20261017' }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/run_http_category_bench.py \
            --workloads "$BENCHMARK_FASTAPI_WORKLOAD" \
            --servers uvicorn-rs-asyncio uvicorn-asyncio-httptools \
              uvicorn-rs-uvloop uvicorn-uvloop-httptools \
            --duration "$BENCHMARK_DURATION" --warmup "$BENCHMARK_WARMUP" \
            --concurrency "$BENCHMARK_CONCURRENCY" --repetitions "$BENCHMARK_REPETITIONS" \
            --seed "$BENCHMARK_SEED" \
            --output "target/fastapi-match/http1.json" \
            2>&1 | tee target/fastapi-match/driver.log
      - name: Require three correctness-gated matching repetitions per loop
        if: always()
        shell: bash
        env:
          BENCHMARK_FASTAPI_WORKLOAD: ${{ inputs.fastapi_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-workload=fastapi-upload-1m-write-1k]') && 'fastapi-upload-1m-write-1k') || 'fastapi-validated-route' }}
        run: |
          set -euo pipefail
          if ! test -f target/fastapi-match/http1.json; then
            printf '%s\n' 'No raw FastAPI benchmark report was produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          .venv/bin/python scripts/summarize_focused_fastapi_match.py \
            --input target/fastapi-match/http1.json \
            --workload "$BENCHMARK_FASTAPI_WORKLOAD" \
            --output-dir target/fastapi-match
          cat target/fastapi-match/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain focused FastAPI matched timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastapi-match-${{ inputs.fastapi_system || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-system=linux-aarch64]') && 'linux-aarch64') || 'linux-x86_64' }}-${{ inputs.fastapi_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-workload=fastapi-upload-1m-write-1k]') && 'fastapi-upload-1m-write-1k') || 'fastapi-validated-route' }}-${{ github.sha }}
          path: |
            target/benchmark-preparation/
            target/fastapi-match/
          if-no-files-found: warn
          retention-days: 90

