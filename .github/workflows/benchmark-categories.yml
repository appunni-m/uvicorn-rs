  focused-h2-diagnostic:
    name: ${{ inputs.h2_system || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-system=macos-arm64]') && 'macos-arm64') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-system=linux-aarch64]') && 'linux-aarch64') || 'linux-x86_64' }} · ${{ inputs.h2_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-server=hypercorn-uvloop]') && 'hypercorn-uvloop') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-server=uvicorn-rs-uvloop]') && 'uvicorn-rs-uvloop') || 'uvicorn-rs-asyncio' }} · ${{ inputs.h2_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-workload=many-response-chunks]') && 'many-response-chunks') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-workload=request-upload-small-chunks]') && 'request-upload-small-chunks') || 'protocol-scope' }}
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'focused-h2') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[focused-h2]')) }}
    runs-on: ${{ (inputs.h2_system == 'linux-aarch64' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-system=linux-aarch64]'))) && 'ubuntu-24.04-arm' || (inputs.h2_system == 'macos-arm64' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-system=macos-arm64]'))) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Prepare one-case diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation target/benchmark-categories
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcurl4-openssl-dev
          else
            brew install curl pkg-config openssl@3
            brew_paths="$(brew --prefix curl)/bin:$(brew --prefix openssl@3)/bin"
            echo "$brew_paths" | tr ':' '\n' >> "$GITHUB_PATH"
            export PATH="$brew_paths:$PATH"
          fi
          uv sync --python "$PYTHON_VERSION" --group benchmark --group fastapi-benchmark --frozen --no-install-project
          .venv/bin/python --version
          rustc --version --verbose
          openssl version
          uname -a
      - name: Build and install the runtime-diagnostics server wheel
        shell: bash
        env:
          BENCHMARK_RUNTIME_DIAGNOSTICS: ${{ github.event_name != 'workflow_dispatch' || inputs.h2_runtime_diagnostics == true }}
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation/server-wheels
          if [[ "$BENCHMARK_RUNTIME_DIAGNOSTICS" == "true" ]]; then
            uvx --from maturin==1.14.1 maturin build --release --locked --features runtime-diagnostics \
              --interpreter "$GITHUB_WORKSPACE/.venv/bin/python" \
              --out "$GITHUB_WORKSPACE/target/benchmark-preparation/server-wheels" \
              2>&1 | tee target/benchmark-preparation/server-build.log
          else
            uvx --from maturin==1.14.1 maturin build --release --locked \
              --interpreter "$GITHUB_WORKSPACE/.venv/bin/python" \
              --out "$GITHUB_WORKSPACE/target/benchmark-preparation/server-wheels" \
              2>&1 | tee target/benchmark-preparation/server-build.log
          fi
          server_wheel="$(.venv/bin/python -c 'from pathlib import Path; import sys; wheels = sorted(Path("target/benchmark-preparation/server-wheels").glob("*.whl")); print(wheels[0]) if len(wheels) == 1 else sys.exit("expected exactly one server wheel")')"
          uv pip install --python .venv/bin/python --no-deps "$server_wheel" \
            2>&1 | tee target/benchmark-preparation/server-install.log
      - name: Build the normal HTTP/2 probe client
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path tools/http3-probe/Cargo.toml --bin http2 \
            2>&1 | tee target/benchmark-preparation/http2-client-build.log
      - name: Run one selected HTTP/2 workload on one selected server
        shell: bash
        env:
          BENCHMARK_DURATION: ${{ inputs.duration || '5' }}
          BENCHMARK_WARMUP: ${{ inputs.warmup || '1' }}
          BENCHMARK_CONCURRENCY: ${{ inputs.concurrency || '64' }}
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions || (github.event_name == 'push' && contains(github.event.head_commit.message, '[focused-h2]') && '1') || '5' }}
          BENCHMARK_SEED: ${{ inputs.seed || '20261005' }}
          BENCHMARK_H2_SERVER: ${{ inputs.h2_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-server=hypercorn-uvloop]') && 'hypercorn-uvloop') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-server=uvicorn-rs-uvloop]') && 'uvicorn-rs-uvloop') || 'uvicorn-rs-asyncio' }}
          BENCHMARK_H2_WORKLOAD: ${{ inputs.h2_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-workload=many-response-chunks]') && 'many-response-chunks') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-workload=request-upload-small-chunks]') && 'request-upload-small-chunks') || 'protocol-scope' }}
          BENCHMARK_RUNTIME_DIAGNOSTICS: ${{ github.event_name != 'workflow_dispatch' || inputs.h2_runtime_diagnostics == true }}
          RUST_BACKTRACE: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          if [[ "$BENCHMARK_RUNTIME_DIAGNOSTICS" == "true" ]]; then
            diagnostic_args=(--diagnostics)
          else
            diagnostic_args=(--client-diagnostics)
          fi
          .venv/bin/python scripts/run_h2_category_bench.py \
            --servers "$BENCHMARK_H2_SERVER" \
            --repetitions "$BENCHMARK_REPETITIONS" --seed "$BENCHMARK_SEED" \
            "${diagnostic_args[@]}" \
            --output target/benchmark-categories/h2-focused.json \
            --workloads "$BENCHMARK_H2_WORKLOAD" \
            --duration "$BENCHMARK_DURATION" --warmup "$BENCHMARK_WARMUP" \
            --concurrency "$BENCHMARK_CONCURRENCY" \
            2>&1 | tee target/benchmark-preparation/h2-focused-driver.log
      - name: Retain focused diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h2-focused-${{ inputs.h2_system || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-system=macos-arm64]') && 'macos-arm64') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-system=linux-aarch64]') && 'linux-aarch64') || 'linux-x86_64' }}-${{ inputs.h2_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-server=hypercorn-uvloop]') && 'hypercorn-uvloop') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-server=uvicorn-rs-uvloop]') && 'uvicorn-rs-uvloop') || 'uvicorn-rs-asyncio' }}-${{ inputs.h2_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-workload=many-response-chunks]') && 'many-response-chunks') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h2-workload=request-upload-small-chunks]') && 'request-upload-small-chunks') || 'protocol-scope' }}-${{ github.sha }}
          path: |
            target/benchmark-preparation/
            target/benchmark-categories/
          if-no-files-found: warn
          retention-days: 90

  focused-h3-diagnostic:
    name: focused HTTP/3 diagnostic
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'focused-h3') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[focused-h3]')) }}
    runs-on: ${{ (inputs.h3_system == 'linux-aarch64' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-system=linux-aarch64]'))) && 'ubuntu-24.04-arm' || (inputs.h3_system == 'macos-arm64' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-system=macos-arm64]'))) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Prepare one-case diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation target/benchmark-categories
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcurl4-openssl-dev
          else
            brew install curl pkg-config openssl@3
            brew_paths="$(brew --prefix curl)/bin:$(brew --prefix openssl@3)/bin"
            echo "$brew_paths" | tr ':' '\n' >> "$GITHUB_PATH"
            export PATH="$brew_paths:$PATH"
          fi
          uv sync --python "$PYTHON_VERSION" --group benchmark --group fastapi-benchmark --frozen --no-install-project
          .venv/bin/python --version
          rustc --version --verbose
          openssl version
          uname -a
      - name: Build and install the normal release server wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation/server-wheels
          uvx --from maturin==1.14.1 maturin build --release --locked \
            --interpreter "$GITHUB_WORKSPACE/.venv/bin/python" \
            --out "$GITHUB_WORKSPACE/target/benchmark-preparation/server-wheels" \
            2>&1 | tee target/benchmark-preparation/server-build.log
          server_wheel="$(.venv/bin/python -c 'from pathlib import Path; import sys; wheels = sorted(Path("target/benchmark-preparation/server-wheels").glob("*.whl")); print(wheels[0]) if len(wheels) == 1 else sys.exit("expected exactly one server wheel")')"
          uv pip install --python .venv/bin/python --no-deps "$server_wheel" \
            2>&1 | tee target/benchmark-preparation/server-install.log
      - name: Build the normal HTTP/3 probe client
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path tools/http3-probe/Cargo.toml --bin bench \
            2>&1 | tee target/benchmark-preparation/http3-client-build.log
      - name: Run one selected HTTP/3 workload on selected server(s)
        shell: bash
        env:
          BENCHMARK_DURATION: ${{ inputs.duration || '5' }}
          BENCHMARK_WARMUP: ${{ inputs.warmup || '1' }}
          BENCHMARK_H3_CONCURRENCY: ${{ inputs.h3_concurrency || '1' }}
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '5' }}
          BENCHMARK_SEED: ${{ inputs.seed || '20261005' }}
          BENCHMARK_H3_TRACE: ${{ inputs.h3_trace_hypercorn_events || false }}
          BENCHMARK_H3_SERVERS: ${{ (inputs.h3_server == 'asyncio-pair' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-server=asyncio-pair]'))) && 'hypercorn-asyncio uvicorn-rs-asyncio' || (inputs.h3_server == 'uvloop-pair' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-server=uvloop-pair]'))) && 'hypercorn-uvloop uvicorn-rs-uvloop' || inputs.h3_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-server=hypercorn-uvloop]') && 'hypercorn-uvloop') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-server=uvicorn-rs-uvloop]') && 'uvicorn-rs-uvloop') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-server=uvicorn-rs-asyncio]') && 'uvicorn-rs-asyncio') || 'hypercorn-asyncio' }}
          BENCHMARK_H3_WORKLOAD: ${{ inputs.h3_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-workload=protocol-scope-consumed-request]') && 'protocol-scope-consumed-request') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-workload=protocol-scope]') && 'protocol-scope') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-workload=fixed]') && 'fixed') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-workload=many-response-chunks]') && 'many-response-chunks') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-workload=request-upload]') && 'request-upload') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[h3-workload=slow-reader-backpressure]') && 'slow-reader-backpressure') || 'large-response' }}
          RUST_BACKTRACE: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          read -r -a h3_servers <<<"$BENCHMARK_H3_SERVERS"
          trace_args=()
          if [[ "$BENCHMARK_H3_TRACE" == "true" ]]; then
            if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "ARM64" \
              || "${#h3_servers[@]}" != "1" || "${h3_servers[0]}" != "hypercorn-asyncio" \
              || "$BENCHMARK_H3_WORKLOAD" != "slow-reader-backpressure" \
              || "$BENCHMARK_REPETITIONS" != "1" ]]; then
              echo "H3 event tracing requires Linux ARM64, Hypercorn asyncio, slow-reader-backpressure, and one repetition" >&2
              exit 2
            fi
            trace_args+=(--trace-hypercorn-h3-events)
          fi
          .venv/bin/python scripts/run_h3_category_bench.py \
            --servers "${h3_servers[@]}" \
            --repetitions "$BENCHMARK_REPETITIONS" --seed "$BENCHMARK_SEED" \
            --output target/benchmark-categories/h3-focused.json \
            --workloads "$BENCHMARK_H3_WORKLOAD" \
            --duration "$BENCHMARK_DURATION" --warmup "$BENCHMARK_WARMUP" \
            --concurrency "$BENCHMARK_H3_CONCURRENCY" \
            "${trace_args[@]}" \
            2>&1 | tee target/benchmark-preparation/h3-focused-driver.log
      - name: Retain focused diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h3-focused-${{ github.sha }}
          path: |
            target/benchmark-preparation/
            target/benchmark-categories/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Validate and render the multi-system evidence
    needs: categories
    if: always() && !((github.event_name == 'workflow_dispatch' && inputs.run_mode != 'full') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[focused-fastapi-match]') || contains(github.event.head_commit.message, '[focused-fastapi-stage]') || contains(github.event.head_commit.message, '[focused-h2]') || contains(github.event.head_commit.message, '[focused-h3]')))) && needs.categories.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix_status: ${{ steps.validate.outputs.matrix_status }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asgi-category-benchmarks-*
          path: target/benchmark-matrix/artifacts
          merge-multiple: false
      - name: Validate identities and keep system results separate
        id: validate
        run: |
          set -euo pipefail
          python scripts/aggregate_benchmark_matrix.py \
            --artifacts target/benchmark-matrix/artifacts \
            --output-dir target/benchmark-matrix/aggregate \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            | tee target/benchmark-matrix/aggregation.json
          matrix_status="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("target/benchmark-matrix/aggregate/matrix.json").read_text())["status"])')"
          printf 'matrix_status=%s\n' "$matrix_status" >> "$GITHUB_OUTPUT"
          cat target/benchmark-matrix/aggregate/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asgi-benchmark-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-matrix/aggregate/
          if-no-files-found: error
          retention-days: 90

  update-docs:
    name: Prepare benchmark documentation for review
    needs: [categories, aggregate]
    if: always() && !((github.event_name == 'workflow_dispatch' && inputs.run_mode != 'full') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[focused-fastapi-match]') || contains(github.event.head_commit.message, '[focused-fastapi-stage]') || contains(github.event.head_commit.message, '[focused-h2]') || contains(github.event.head_commit.message, '[focused-h3]')))) && github.ref == 'refs/heads/main' && github.repository == 'appunni-m/uvicorn-rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.aggregate.result == 'success'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: asgi-benchmark-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-matrix/aggregate
      - name: Record the latest attempt and prepare the docs update
        shell: bash
        env:
          CATEGORY_RESULT: ${{ needs.categories.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          MATRIX_STATUS: ${{ needs.aggregate.outputs.matrix_status }}
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-status
          latest_status=target/benchmark-status/latest-attempt.md
          cat > "$latest_status" <<EOF
          ## Latest automated benchmark attempt

          - Run: [${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - Commit: [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - Recorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Category matrix job: \`${CATEGORY_RESULT}\`
          - Aggregate job: \`${AGGREGATE_RESULT}\`

          EOF
          if [[ "$AGGREGATE_RESULT" == "success" ]]; then
            if [[ "$MATRIX_STATUS" == "validated_complete_matrix" ]]; then
              cp target/benchmark-matrix/aggregate/report.md docs/benchmark-results.md
              cat >> "$latest_status" <<EOF
          All three systems produced a complete validated matrix. The [latest complete benchmark report](benchmark-results.md) is included in this documentation update. Hashed machine-readable receipts and raw system bundles remain in this run's GitHub Actions artifacts for 90 days; generated logs and per-run files are not committed.
          EOF
            else
              cat >> "$latest_status" <<EOF
          The three system artifacts were validated and the partial report, hashed receipts, and raw system bundles are retained in this run's GitHub Actions artifacts for 90 days. Generated logs and per-run files are not committed. The [previous complete report](benchmark-results.md) remains unchanged.
          EOF
            fi
          else
            cat >> "$latest_status" <<EOF
          This attempt did not produce a validated three-system aggregate. No performance result was generated or substituted. The [previous complete report](benchmark-results.md) remains the latest measured result; inspect the [workflow artifacts and logs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) for this attempt.
          EOF
          fi
          python - "$latest_status" docs/benchmark-status.md <<'PY'
          import sys
          from pathlib import Path

          begin = "<!-- BEGIN GENERATED LATEST ATTEMPT -->"
          end = "<!-- END GENERATED LATEST ATTEMPT -->"
          latest_path, document_path = map(Path, sys.argv[1:])
          document = document_path.read_text(encoding="utf-8")
          if document.count(begin) != 1 or document.count(end) != 1:
              raise SystemExit("benchmark status document must contain exactly one generated-attempt marker pair")
          before, remainder = document.split(begin, 1)
          _, after = remainder.split(end, 1)
          latest = latest_path.read_text(encoding="utf-8").strip()
          document_path.write_text(
              before + begin + "\n" + latest + "\n" + end + after,
              encoding="utf-8",
          )
          PY
      - name: Retain the documentation changes for develop or main
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- docs/benchmark-status.md docs/benchmark-results.md \
            > target/benchmark-status/docs-update.patch
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          The benchmark documentation patch is retained in this run's artifact for review and application on develop or main. Raw results and hashed receipts remain in the benchmark artifacts. This job does not push a branch.
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asgi-benchmark-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-status/
          if-no-files-found: error
          retention-days: 90
