  aggregate:
    name: Validate and render the multi-system evidence
    needs: categories
    if: always() && !((github.event_name == 'workflow_dispatch' && (inputs.run_mode == 'focused-fastapi-match' || inputs.run_mode == 'focused-fastapi-stage' || inputs.run_mode == 'focused-h2' || inputs.run_mode == 'focused-h3')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[focused-fastapi-match]') || contains(github.event.head_commit.message, '[focused-fastapi-stage]') || contains(github.event.head_commit.message, '[focused-h2]') || contains(github.event.head_commit.message, '[focused-h3]')))) && needs.categories.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix_status: ${{ steps.validate.outputs.matrix_status }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asgi-category-benchmarks-*
          path: target/benchmark-matrix/artifacts
          merge-multiple: false
      - name: Validate identities and keep system results separate
        id: validate
        run: |
          set -euo pipefail
          python scripts/aggregate_benchmark_matrix.py \
            --artifacts target/benchmark-matrix/artifacts \
            --output-dir target/benchmark-matrix/aggregate \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            | tee target/benchmark-matrix/aggregation.json
          matrix_status="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("target/benchmark-matrix/aggregate/matrix.json").read_text())["status"])')"
          printf 'matrix_status=%s\n' "$matrix_status" >> "$GITHUB_OUTPUT"
          cat target/benchmark-matrix/aggregate/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asgi-benchmark-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-matrix/aggregate/
          if-no-files-found: error
          retention-days: 90

  update-docs:
    name: Record benchmark status and update documentation
    needs: [categories, aggregate]
    if: always() && !((github.event_name == 'workflow_dispatch' && (inputs.run_mode == 'focused-fastapi-match' || inputs.run_mode == 'focused-fastapi-stage' || inputs.run_mode == 'focused-h2' || inputs.run_mode == 'focused-h3')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[focused-fastapi-match]') || contains(github.event.head_commit.message, '[focused-fastapi-stage]') || contains(github.event.head_commit.message, '[focused-h2]') || contains(github.event.head_commit.message, '[focused-h3]')))) && github.ref == 'refs/heads/main' && github.repository == 'appunni-m/uvicorn-rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.aggregate.result == 'success'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: asgi-benchmark-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-matrix/aggregate
      - name: Record the latest attempt and prepare the docs update
        shell: bash
        env:
          CATEGORY_RESULT: ${{ needs.categories.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          MATRIX_STATUS: ${{ needs.aggregate.outputs.matrix_status }}
        run: |
          set -euo pipefail
          cat > docs/benchmark-status.md <<EOF
          <!-- Generated by the ASGI performance matrix workflow. -->
          # Latest automated benchmark attempt

          - Run: [${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - Commit: [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - Recorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Category matrix job: \`${CATEGORY_RESULT}\`
          - Aggregate job: \`${AGGREGATE_RESULT}\`

          EOF
          if [[ "$AGGREGATE_RESULT" == "success" ]]; then
            if [[ "$MATRIX_STATUS" == "validated_complete_matrix" ]]; then
              cp target/benchmark-matrix/aggregate/report.md docs/benchmark-results.md
              cat >> docs/benchmark-status.md <<EOF
          All three systems produced a complete validated matrix. The [latest complete benchmark report](benchmark-results.md) is included in this documentation update. Hashed machine-readable receipts and raw system bundles remain in this run's GitHub Actions artifacts for 90 days; generated logs and per-run files are not committed.
          EOF
            else
              cat >> docs/benchmark-status.md <<EOF
          The three system artifacts were validated and the partial report, hashed receipts, and raw system bundles are retained in this run's GitHub Actions artifacts for 90 days. Generated logs and per-run files are not committed. The [previous complete report](benchmark-results.md) remains unchanged.
          EOF
            fi
          else
            cat >> docs/benchmark-status.md <<EOF
          This attempt did not produce a validated three-system aggregate. No performance result was generated or substituted. The [previous complete report](benchmark-results.md) remains the latest measured result; inspect the [workflow artifacts and logs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) for this attempt.
          EOF
          fi
      - name: Propose the updated results documentation
        env:
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          MATRIX_STATUS: ${{ needs.aggregate.outputs.matrix_status }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/benchmark-results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch" "$GITHUB_SHA"
          git add docs/benchmark-status.md
          if [[ "$AGGREGATE_RESULT" == "success" ]]; then
            if [[ "$MATRIX_STATUS" == "validated_complete_matrix" ]]; then
              git add docs/benchmark-results.md
              commit_message="docs: refresh hosted benchmark results"
            else
              commit_message="docs: record partial benchmark status"
            fi
          else
            commit_message="docs: record hosted benchmark attempt"
          fi
          git commit -m "$commit_message"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            previous="$(git rev-parse "refs/remotes/origin/$branch")"
            git push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Documentation changes were pushed to [`${branch}`](${compare_url}) for review. This repository's Actions token cannot create pull requests, so the compare link is provided for manual review. The branch contains only maintained documentation; generated benchmark logs, raw reports, and coverage outputs remain in workflow artifacts or ignored local paths.
          EOF
