          fi
          .venv/bin/python scripts/run_h3_category_bench.py "${benchmark_args[@]}" \
            2>&1 | tee target/benchmark-preparation/h3-focused-driver.log
      - name: Retain focused diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h3-focused-${{ github.sha }}
          path: |
            target/benchmark-preparation/
            target/benchmark-categories/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Validate and render the multi-system evidence
    needs: categories
    if: always() && !((github.event_name == 'workflow_dispatch' && inputs.run_mode != 'full') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[focused-fastapi-match]') || contains(github.event.head_commit.message, '[focused-fastapi-stage]') || contains(github.event.head_commit.message, '[focused-h2]') || contains(github.event.head_commit.message, '[focused-h3]')))) && needs.categories.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix_status: ${{ steps.validate.outputs.matrix_status }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asgi-category-benchmarks-*
          path: target/benchmark-matrix/artifacts
          merge-multiple: false
      - name: Validate identities and keep system results separate
        id: validate
        run: |
          set -euo pipefail
          python scripts/aggregate_benchmark_matrix.py \
            --artifacts target/benchmark-matrix/artifacts \
            --output-dir target/benchmark-matrix/aggregate \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            | tee target/benchmark-matrix/aggregation.json
          matrix_status="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("target/benchmark-matrix/aggregate/matrix.json").read_text())["status"])')"
          printf 'matrix_status=%s\n' "$matrix_status" >> "$GITHUB_OUTPUT"
          cat target/benchmark-matrix/aggregate/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asgi-benchmark-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-matrix/aggregate/
          if-no-files-found: error
          retention-days: 90
