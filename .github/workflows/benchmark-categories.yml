name: ASGI performance matrix

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - uv.lock
      - src/**
      - python/**
      - scripts/**
      - examples/**
      - tools/http3-probe/**
      - tests/parity/**
      - parity/**
      - .github/workflows/benchmark-categories.yml
      - docs/benchmarks.md
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds of sustained load per sample
        default: "5"
        required: true
        type: string
      warmup:
        description: Warmup seconds per sustained sample
        default: "1"
        required: true
        type: string
      concurrency:
        description: Requested concurrency; maintained workload overrides still apply
        default: "64"
        required: true
        type: string
      repetitions:
        description: Repetitions per server; five are collected and three valid matches are required
        default: "5"
        required: true
        type: string
      seed:
        description: Deterministic seed for within-repetition server ordering
        default: "20261005"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: asgi-performance-matrix-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.13"
  RUST_TOOLCHAIN: "1.98.1"
  FRAMEWORK_REVISION: "738c43362938896c268ca29b9a9a2a5942df510c"
  CARGO_TERM_COLOR: never
  RUSTFLAGS: ""
  CARGO_ENCODED_RUSTFLAGS: ""
  RUSTC_WRAPPER: ""
  RUSTC_WORKSPACE_WRAPPER: ""

jobs:
  categories:
    name: ${{ matrix.system.id }} · parity and sequential categories
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        system:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.system.runner }}
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Prepare stock benchmark environment and record host tools
        shell: bash
        env:
          BENCHMARK_SYSTEM_ID: ${{ matrix.system.id }}
          BENCHMARK_RUNNER: ${{ matrix.system.runner }}
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation
          exec > >(tee target/benchmark-preparation/environment.log) 2>&1
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcurl4-openssl-dev
            dpkg-query -W build-essential pkg-config libssl-dev libcurl4-openssl-dev > target/benchmark-preparation/system-packages.txt
            lscpu
            cpu_model="$(lscpu -J | python3 -c 'import json,sys; print(next((item["data"] for item in json.load(sys.stdin)["lscpu"] if item["field"].strip(":") == "Model name"), "unknown"))')"
          else
            brew install curl pkg-config openssl@3
            brew_paths="$(brew --prefix curl)/bin:$(brew --prefix openssl@3)/bin"
            echo "$brew_paths" | tr ':' '\n' >> "$GITHUB_PATH"
            export PATH="$brew_paths:$PATH"
            brew list --versions curl pkg-config openssl@3 > target/benchmark-preparation/system-packages.txt
            system_profiler SPHardwareDataType
            cpu_model="$(sysctl -n machdep.cpu.brand_string)"
            sysctl -n hw.physicalcpu hw.logicalcpu
          fi
          export BENCHMARK_CPU_MODEL="$cpu_model"
          printf 'BENCHMARK_CPU_MODEL=%s\n' "$cpu_model" >> "$GITHUB_ENV"
          uv sync --python "$PYTHON_VERSION" --group benchmark --frozen --no-install-project
          uv --version
          .venv/bin/python --version
          rustc --version --verbose
          cargo --version
          node --version
          cc --version
          curl-config --version
          openssl version
          uname -a
          .venv/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import platform
          import psutil
          from pathlib import Path
          names = ("uvicorn", "hypercorn", "aioquic", "uvloop", "httptools", "psutil", "h2", "h11", "websockets", "anyio", "typing-extensions")
          report = {"system_id": os.environ["BENCHMARK_SYSTEM_ID"],
                    "runner_label": os.environ["BENCHMARK_RUNNER"],
                    "os": platform.system(), "architecture": platform.machine(),
                    "cpu_model": os.environ.get("BENCHMARK_CPU_MODEL", "unknown"),
                    "logical_cpu_count": os.cpu_count(),
                    "physical_cpu_count": psutil.cpu_count(logical=False),
                    "memory_total_bytes": psutil.virtual_memory().total,
                    "python": platform.python_version(), "platform": platform.platform(),
                    "framework_revision": os.environ["FRAMEWORK_REVISION"],
                    "packages": {name: metadata.version(name) for name in names},
                    "hosted_runner": {name: os.environ.get(name) for name in ("ImageOS", "ImageVersion", "RUNNER_ARCH", "RUNNER_NAME")},
                    "limits": ["Fresh hosted VM, not dedicated hardware or an assurance of no noisy neighbors.",
                               "Closed-loop client and server share the VM; client CPU and observer overhead are reported.",
                               "System package and hosted image versions are recorded, not frozen by this workflow."]}
          Path("target/benchmark-preparation/environment.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Build and install the normal release server wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation/server-wheels
          uvx --from maturin==1.14.1 maturin build --release --locked \
            --interpreter "$GITHUB_WORKSPACE/.venv/bin/python" \
            --out "$GITHUB_WORKSPACE/target/benchmark-preparation/server-wheels" \
            2>&1 | tee target/benchmark-preparation/server-build.log
          server_wheel="$(.venv/bin/python -c 'from pathlib import Path; import sys; wheels = sorted(Path("target/benchmark-preparation/server-wheels").glob("*.whl")); print(wheels[0]) if len(wheels) == 1 else sys.exit("expected exactly one server wheel")')"
          uv pip install --python .venv/bin/python --no-deps "$server_wheel" \
            2>&1 | tee target/benchmark-preparation/server-install.log
      - name: Build and install the independent frozen framework wheel
        shell: bash
        run: |
          set -euo pipefail
          framework_dir="$RUNNER_TEMP/starlette-rs"
          framework_target="$RUNNER_TEMP/starlette-rs-cargo-target"
          wheel_dir="$GITHUB_WORKSPACE/target/benchmark-preparation/framework-wheels"
          mkdir -p "$wheel_dir"
          git init "$framework_dir"
          git -C "$framework_dir" remote add origin https://github.com/appunni-m/starlette-rs.git
          git -C "$framework_dir" fetch --depth 1 origin "$FRAMEWORK_REVISION"
          git -C "$framework_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$framework_dir" rev-parse HEAD)" = "$FRAMEWORK_REVISION"
          git -C "$framework_dir" archive HEAD > target/benchmark-preparation/framework-source.tar
          git -C "$framework_dir" rev-parse HEAD > target/benchmark-preparation/framework-revision.txt
          (
            cd "$framework_dir"
            env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cap-lints warn" \
              RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" CARGO_TARGET_DIR="$framework_target" \
              uvx --from maturin==1.14.1 maturin build --release --locked \
                --interpreter "$GITHUB_WORKSPACE/.venv/bin/python" --out "$wheel_dir"
          ) 2>&1 | tee target/benchmark-preparation/framework-build.log
          test -z "$(git -C "$framework_dir" status --porcelain --untracked-files=no)"
          framework_wheel="$(.venv/bin/python -c 'from pathlib import Path; import sys; wheels = sorted(Path(sys.argv[1]).glob("*.whl")); print(wheels[0]) if len(wheels) == 1 else sys.exit("expected exactly one framework wheel")' "$wheel_dir")"
          uv pip install --python .venv/bin/python --no-deps "$framework_wheel" \
            2>&1 | tee target/benchmark-preparation/framework-install.log
          .venv/bin/python - <<'PY'
          import hashlib
          import importlib.metadata as metadata
          import importlib.util
          import json
          import os
          from pathlib import Path
          base = Path("target/benchmark-preparation")
          files = [base / "framework-source.tar", *sorted((base / "framework-wheels").glob("*.whl")),
                   *sorted((base / "server-wheels").glob("*.whl"))]
          distributions = {}
          for name, module in (("starlette-rs-py", "starlette_rs_py._core"), ("uvicorn-rs", "uvicorn_rs._native")):
              distribution = metadata.distribution(name)
              native = Path(importlib.util.find_spec(module).origin)
              record = distribution.read_text("RECORD")
              distributions[name] = {"version": distribution.version, "native_path": str(native),
                                     "native_sha256": hashlib.sha256(native.read_bytes()).hexdigest(),
                                     "record_sha256": hashlib.sha256(record.encode()).hexdigest() if record else None,
                                     "direct_url": distribution.read_text("direct_url.json")}
          receipt = {"framework_repository": "https://github.com/appunni-m/starlette-rs.git",
                     "framework_revision": os.environ["FRAMEWORK_REVISION"],
                     "build": "maturin 1.14.1, --release --locked, default features; RUSTFLAGS=--cap-lints warn only for this third-party fixture; no framework source edits",
                     "files": {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in files},
                     "installed_distributions": distributions,
                     "independence": "Optional benchmark environment wheel only; no uvicorn-rs runtime dependency or bundle."}
          (base / "wheel-build-record.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Compare the normal wheel with Uvicorn on the frozen starlette-rs app
        shell: bash
        run: |
          set -euo pipefail
          server_wheel="$(.venv/bin/python -c 'from pathlib import Path; import sys; wheels = sorted(Path("target/benchmark-preparation/server-wheels").glob("*.whl")); print(wheels[0]) if len(wheels) == 1 else sys.exit("expected exactly one server wheel")')"
          framework_wheel="$(.venv/bin/python -c 'from pathlib import Path; import sys; wheels = sorted(Path("target/benchmark-preparation/framework-wheels").glob("*.whl")); print(wheels[0]) if len(wheels) == 1 else sys.exit("expected exactly one framework wheel")')"
          .venv/bin/python scripts/probe_starlette_rs.py \
            --framework starlette-rs \
            --server-wheel "$server_wheel" \
            --framework-wheel "$framework_wheel" \
            --output target/benchmark-preparation/starlette-rs-integration.json
      - name: Prebuild normal protocol clients and freeze the measured identity
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path tools/http3-probe/Cargo.toml --bins \
            2>&1 | tee target/benchmark-preparation/client-build.log
          .venv/bin/python scripts/run_benchmark_categories.py \
            --capture-identity target/benchmark-preparation/parity-before.json \
            2>&1 | tee target/benchmark-preparation/freeze.log
      - name: Gate the exact normal binary on every indexed public parity case
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/run_parity.py \
            --output target/benchmark-preparation/parity.json \
            2>&1 | tee target/benchmark-preparation/parity.log
      - name: Run every maintained category sequentially and analyze matching valid repetitions
        shell: bash
        env:
          BENCHMARK_DURATION: ${{ inputs.duration || '5' }}
          BENCHMARK_WARMUP: ${{ inputs.warmup || '1' }}
          BENCHMARK_CONCURRENCY: ${{ inputs.concurrency || '64' }}
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '5' }}
          BENCHMARK_SEED: ${{ inputs.seed || '20261005' }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/run_benchmark_categories.py \
            --parity-before-identity target/benchmark-preparation/parity-before.json \
            --parity-report target/benchmark-preparation/parity.json \
            --output-dir target/benchmark-categories \
            --duration "$BENCHMARK_DURATION" --warmup "$BENCHMARK_WARMUP" \
            --concurrency "$BENCHMARK_CONCURRENCY" --repetitions "$BENCHMARK_REPETITIONS" \
            --seed "$BENCHMARK_SEED" 2>&1 | tee target/benchmark-preparation/categories-driver.log
      - name: Retain or recover analysis for an interrupted category run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f target/benchmark-categories/run.json && ! test -f target/benchmark-categories/analysis.json; then
            .venv/bin/python scripts/analyze_benchmark_categories.py --input-dir target/benchmark-categories \
              > target/benchmark-preparation/analysis-recovery.log 2>&1
          fi
          if test -f target/benchmark-categories/analysis.md; then
            cat target/benchmark-categories/analysis.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'No complete benchmark analysis: inspect retained preparation/parity/category logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: asgi-category-benchmarks-${{ matrix.system.id }}
          path: |
            target/benchmark-preparation/
            target/benchmark-categories/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    name: Validate and render the multi-system evidence
    needs: categories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asgi-category-benchmarks-*
          path: target/benchmark-matrix/artifacts
          merge-multiple: false
      - name: Validate identities and keep system results separate
        run: |
          set -euo pipefail
          python scripts/aggregate_benchmark_matrix.py \
            --artifacts target/benchmark-matrix/artifacts \
            --output-dir target/benchmark-matrix/aggregate \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            | tee target/benchmark-matrix/aggregation.json
          cat target/benchmark-matrix/aggregate/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asgi-benchmark-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-matrix/aggregate/
          if-no-files-found: error
          retention-days: 90

  update-docs:
    name: Record benchmark status and update documentation
    needs: [categories, aggregate]
    if: always() && github.ref == 'refs/heads/main' && github.repository == 'appunni-m/uvicorn-rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.aggregate.result == 'success'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: asgi-benchmark-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-matrix/aggregate
      - name: Record the latest attempt and archive a completed matrix
        shell: bash
        env:
          CATEGORY_RESULT: ${{ needs.categories.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
        run: |
          set -euo pipefail
          run_key="${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          cat > docs/benchmark-status.md <<EOF
          <!-- Generated by the ASGI performance matrix workflow. -->
          # Latest automated benchmark attempt

          - Run: [${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - Commit: [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - Recorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Category matrix job: \`${CATEGORY_RESULT}\`
          - Aggregate job: \`${AGGREGATE_RESULT}\`

          EOF
          if [[ "$AGGREGATE_RESULT" == "success" ]]; then
            result_dir="benchmarks/results/hosted/${run_key}"
            mkdir -p "$result_dir"
            cp target/benchmark-matrix/aggregate/matrix.json "$result_dir/matrix.json"
            cp target/benchmark-matrix/aggregate/evidence/*.tar.gz "$result_dir/"
            cp target/benchmark-matrix/aggregate/report.md docs/benchmark-results.md
            sed \
              -e "s#../benchmarks/results/hosted/${run_key}/#./#g" \
              -e 's#](benchmark-status.md)#](../../../../docs/benchmark-status.md)#g' \
              -e 's#](benchmarks.md)#](../../../../docs/benchmarks.md)#g' \
              target/benchmark-matrix/aggregate/report.md > "$result_dir/report.md"
            (cd "$result_dir" && shasum -a 256 matrix.json report.md ./*.tar.gz > SHA256SUMS)
            cat >> docs/benchmark-status.md <<EOF
          All three systems produced a validated aggregate. The [latest complete benchmark report](benchmark-results.md) and [archived matrix receipt](../benchmarks/results/hosted/${run_key}/matrix.json) are included in this documentation update.
          EOF
          else
            cat >> docs/benchmark-status.md <<EOF
          This attempt did not produce a validated three-system aggregate. No performance result was generated or substituted. The [previous complete report](benchmark-results.md) remains the latest measured result; inspect the [workflow artifacts and logs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) for this attempt.
          EOF
          fi
      - name: Propose the updated results documentation
        env:
          GH_TOKEN: ${{ github.token }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/benchmark-results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch" "$GITHUB_SHA"
          run_key="${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          git add docs/benchmark-status.md
          if [[ "$AGGREGATE_RESULT" == "success" ]]; then
            git add docs/benchmark-results.md "benchmarks/results/hosted/${run_key}"
            title="docs: refresh multi-system benchmark results"
            commit_message="docs: archive hosted benchmark results"
          else
            title="docs: record hosted benchmark status"
            commit_message="docs: record hosted benchmark attempt"
          fi
          git commit -m "$commit_message"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            previous="$(git rev-parse "refs/remotes/origin/$branch")"
            git push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          body="$RUNNER_TEMP/benchmark-results-pr.md"
          cat > "$body" <<EOF
          ## Benchmark documentation update

          This records the latest hosted benchmark attempt (${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}, commit ${GITHUB_SHA}) in [the benchmark status page](docs/benchmark-status.md).

          Review the workflow outcome before merging. A validated three-system aggregate also refreshes [the generated per-system report](docs/benchmark-results.md) and archives its machine-readable evidence. Failed or incomplete attempts preserve the previous complete report and link to the current run artifacts.
          EOF
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --base main --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$title" --body-file "$body"
          fi
