            --duration "$BENCHMARK_DURATION" --warmup "$BENCHMARK_WARMUP" \
            --concurrency "$BENCHMARK_CONCURRENCY" --repetitions "$BENCHMARK_REPETITIONS" \
            --seed "$BENCHMARK_SEED" \
            --output "target/fastapi-match/http1.json" \
            2>&1 | tee target/fastapi-match/driver.log
      - name: Require three correctness-gated matching repetitions per loop
        if: always() && inputs.run_mode != 'peer-read-comparison'
        shell: bash
        env:
          BENCHMARK_FASTAPI_WORKLOAD: ${{ inputs.fastapi_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-workload=fastapi-upload-1m-write-1k]') && 'fastapi-upload-1m-write-1k') || 'fastapi-validated-route' }}
