name: ASGI performance matrix

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - uv.lock
      - src/**
      - python/**
      - 'scripts/**'
      - '!scripts/attach_coverage_mcp.py'
      - '!scripts/build_coverage_extension.py'
      - '!scripts/check_ci_evidence.py'
      - '!scripts/coverage_contract.py'
      - '!scripts/coverage_toolchain.py'
      - '!scripts/profile_fastapi_protocols.py'
      - '!scripts/release_evidence.py'
      - '!scripts/run_unified_coverage.py'
      - '!scripts/summarize_unified_coverage.py'
      - examples/**
      - '!examples/**/*.md'
      - tools/http3-probe/**
      - tests/parity/**
      - parity/**
      - '!docs/benchmarks.md'
      - '!docs/releases.md'
      - docs/performance-acceptance.json
      - .github/workflows/benchmark-categories.yml
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      run_mode:
        description: Full matrix, focused FastAPI/H2/H3, or the fixed buffer on/off comparison
        default: full
        required: true
        type: choice
        options:
          - full
          - focused-fastapi-match
          - peer-read-comparison
          - focused-fastapi-stage
          - focused-fastapi-upload-trace
          - focused-h2
          - focused-h3
      fastapi_system:
        description: Runner for the focused FastAPI timing or stage diagnostic
        default: linux-x86_64
        required: true
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - macos-arm64
      fastapi_workload:
        description: One maintained FastAPI workload for a focused comparison
        default: fastapi-validated-route
        required: true
        type: choice
        options:
          - fastapi-fixed
          - fastapi-validated-route
          - fastapi-python-cpu
          - fastapi-large-response
          - fastapi-many-response-chunks
          - fastapi-small-response-chunks
          - fastapi-request-upload
          - fastapi-request-upload-small-chunks
          - fastapi-upload-1m-write-1k
          - fastapi-upload-1m-write-1k-close
          - fastapi-upload-1m-write-16k
          - fastapi-upload-1m-write-256k
          - fastapi-upload-1m-write-1m
          - fastapi-slow-reader-backpressure
          - fastapi-scope-32-headers
          - fastapi-contextvars
      fastapi_stage_loop:
        description: Python event loop used by both servers in the focused ASGI stage diagnostic
        default: asyncio
        required: true
        type: choice
        options:
          - asyncio
          - uvloop
      fastapi_peer_read_mode:
        description: Diagnostic-only peer-read path for the Rust candidate; release builds keep the production default
        default: proactive
        required: true
        type: choice
        options:
          - proactive
          - on-read
      fastapi_peer_read_chunk:
        description: Diagnostic-only proactive read chunk size; the release build stays at 64 KiB
        default: 64k
        required: true
        type: choice
        options:
          - 16k
          - 32k
          - 64k
      fastapi_stage_repetitions:
        description: Attempts for the focused diagnostic, each paired with stock Uvicorn (diagnostic only; up to 10)
        default: "1"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "10"
      upload_trace_timer:
        description: Timer implementation used by the Rust candidate in the focused upload trace run
        default: pinned
        required: true
        type: choice
        options:
          - pinned
          - recreated
      fastapi_trace_tokio:
        description: Optional Tokio version for isolating historical Linux upload timeouts; the repository lockfile remains unchanged
        default: current
        required: true
        type: choice
        options:
          - current
          - 1.53.1
      fastapi_trace_http_deps:
        description: Hyper source version for isolating historical Linux upload timeouts; historical selects the exact 1.11.1 crates.io source archive
        default: current
        required: true
        type: choice
        options:
          - current
          - historical
      upload_trace_requests:
        description: Optional comma-separated worker:attempt pairs to trace, for example 5:2,2:17
        default: ""
        required: false
        type: string
      h2_system:
        description: Runner for the focused HTTP/2 diagnostic
        default: linux-x86_64
        required: true
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - macos-arm64
      h2_server:
        description: One HTTP/2 server to exercise with the probe client
        default: uvicorn-rs-asyncio
        required: true
        type: choice
        options:
          - uvicorn-rs-asyncio
          - uvicorn-rs-uvloop
          - hypercorn-asyncio
          - hypercorn-uvloop
      h2_workload:
        description: One HTTP/2 workload for focused diagnosis
        default: protocol-scope
        required: true
        type: choice
        options:
          - protocol-scope
          - fastapi-validated-route
          - fastapi-python-cpu
          - fixed
          - large-response
          - many-response-chunks
          - request-upload
          - request-upload-small-chunks
          - slow-reader-backpressure
      h2_runtime_diagnostics:
        description: Compile runtime instrumentation into the server; disable for a normal release-binary replay
        default: true
        required: true
        type: boolean
      h3_system:
        description: Runner for the focused HTTP/3 diagnostic
        default: linux-x86_64
        required: true
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - macos-arm64
      h3_server:
        description: One HTTP/3 server or matched asyncio/uvloop server pair
        default: hypercorn-asyncio
        required: true
        type: choice
        options:
          - uvicorn-rs-asyncio
          - uvicorn-rs-uvloop
          - hypercorn-asyncio
          - hypercorn-uvloop
          - asyncio-pair
          - uvloop-pair
      h3_workload:
        description: One HTTP/3 workload for focused diagnosis
        default: large-response
        required: true
        type: choice
        options:
          - protocol-scope-consumed-request
          - protocol-scope
          - fastapi-validated-route
          - fastapi-python-cpu
          - fixed
          - large-response
          - many-response-chunks
          - request-upload
          - slow-reader-backpressure
      h3_trace_hypercorn_events:
        description: Trace H3 stream event/removal ordering; timing is invalid and this requires Linux ARM64, Hypercorn asyncio, slow-reader-backpressure, and one repetition
        default: false
        required: true
        type: boolean
      duration:
        description: Seconds of sustained load per sample
        default: "5"
        required: true
        type: string
      warmup:
        description: Warmup seconds per sustained sample
        default: "1"
        required: true
        type: string
      concurrency:
        description: Requested concurrency; maintained workload overrides still apply
        default: "64"
        required: true
        type: string
      h3_concurrency:
        description: HTTP/3 comparison concurrency; higher values may exceed Hypercorn reference capacity
        default: "1"
        required: true
        type: string
      repetitions:
        description: Repetitions per server; five are collected and three valid matches are required
        default: "5"
        required: true
        type: string
      seed:
        description: Deterministic seed for within-repetition server ordering
        default: "20261005"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: asgi-performance-matrix-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.13"
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_TERM_COLOR: never
  RUSTFLAGS: ""
  CARGO_ENCODED_RUSTFLAGS: ""
  RUSTC_WRAPPER: ""
  RUSTC_WORKSPACE_WRAPPER: ""
  # Capture client and Uvicorn progress if the WSS parity oracle stalls.
  ASGI_PARITY_UVICORN_WEBSOCKET_DEBUG: "1"

jobs:
  categories:
    name: ${{ matrix.system.id }} · parity and sequential categories
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.run_mode != 'full') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[focused-fastapi-match]') || contains(github.event.head_commit.message, '[focused-fastapi-stage]') || contains(github.event.head_commit.message, '[focused-h2]') || contains(github.event.head_commit.message, '[focused-h3]')))) }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        system:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.system.runner }}
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Prepare stock benchmark environment and record host tools
        shell: bash
        env:
          BENCHMARK_SYSTEM_ID: ${{ matrix.system.id }}
          BENCHMARK_RUNNER: ${{ matrix.system.runner }}
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation
          exec > >(tee target/benchmark-preparation/environment.log) 2>&1
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcurl4-openssl-dev
            dpkg-query -W build-essential pkg-config libssl-dev libcurl4-openssl-dev > target/benchmark-preparation/system-packages.txt
            lscpu
            cpu_model="$(lscpu -J | python3 -c 'import json,sys; print(next((item["data"] for item in json.load(sys.stdin)["lscpu"] if item["field"].strip(":") == "Model name"), "unknown"))')"
          else
            brew install curl pkg-config openssl@3
            brew_paths="$(brew --prefix curl)/bin:$(brew --prefix openssl@3)/bin"
            echo "$brew_paths" | tr ':' '\n' >> "$GITHUB_PATH"
            export PATH="$brew_paths:$PATH"
            brew list --versions curl pkg-config openssl@3 > target/benchmark-preparation/system-packages.txt
            system_profiler SPHardwareDataType
            cpu_model="$(sysctl -n machdep.cpu.brand_string)"
            sysctl -n hw.physicalcpu hw.logicalcpu
          fi
          export BENCHMARK_CPU_MODEL="$cpu_model"
          printf 'BENCHMARK_CPU_MODEL=%s\n' "$cpu_model" >> "$GITHUB_ENV"
          uv sync --python "$PYTHON_VERSION" --group benchmark \
            --group fastapi-benchmark --frozen --no-install-project
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-benchmark-oracle"
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --only-group fastapi-benchmark \
            --no-install-project --frozen
          export UVICORN_ORACLE_PYTHON="$oracle_environment/bin/python"
          printf 'UVICORN_ORACLE_PYTHON=%s\n' "$UVICORN_ORACLE_PYTHON" >> "$GITHUB_ENV"
          uv --version
          .venv/bin/python --version
          rustc --version --verbose
          cargo --version
          node --version
          cc --version
          curl-config --version
          openssl version
          uname -a
          .venv/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import platform
          import psutil
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from uvicorn_oracle import inspect_uvicorn_oracle
          names = ("hypercorn", "aioquic", "uvloop", "httptools", "psutil",
                   "h2", "h11", "anyio", "typing-extensions", "fastapi", "pydantic")
          report = {"system_id": os.environ["BENCHMARK_SYSTEM_ID"],
                    "runner_label": os.environ["BENCHMARK_RUNNER"],
                    "os": platform.system(), "architecture": platform.machine(),
                    "cpu_model": os.environ.get("BENCHMARK_CPU_MODEL", "unknown"),
                    "logical_cpu_count": os.cpu_count(),
                    "physical_cpu_count": psutil.cpu_count(logical=False),
                    "memory_total_bytes": psutil.virtual_memory().total,
                    "python": platform.python_version(), "platform": platform.platform(),
                    "packages": {name: metadata.version(name) for name in names},
                    "uvicorn_oracle": inspect_uvicorn_oracle(
                        Path(os.environ["UVICORN_ORACLE_PYTHON"]),
                        expected_python_version=platform.python_version(),
                        required_packages=("httptools", "uvloop", "websockets")),
                    "hosted_runner": {name: os.environ.get(name) for name in ("ImageOS", "ImageVersion", "RUNNER_ARCH", "RUNNER_NAME")},
                    "limits": ["Fresh hosted VM, not dedicated hardware or an assurance of no noisy neighbors.",
                               "Closed-loop client and server share the VM; client CPU and observer overhead are reported.",
                               "System package and hosted image versions are recorded, not frozen by this workflow."]}
          Path("target/benchmark-preparation/environment.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Build and install the normal release server wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation/server-wheels
          uvx --from maturin==1.14.1 maturin build --release --locked \
            --interpreter "$GITHUB_WORKSPACE/.venv/bin/python" \
            --out "$GITHUB_WORKSPACE/target/benchmark-preparation/server-wheels" \
            2>&1 | tee target/benchmark-preparation/server-build.log
          server_wheel="$(.venv/bin/python -c 'from pathlib import Path; import sys; wheels = sorted(Path("target/benchmark-preparation/server-wheels").glob("*.whl")); print(wheels[0]) if len(wheels) == 1 else sys.exit("expected exactly one server wheel")')"
          uv pip install --python .venv/bin/python --no-deps "$server_wheel" \
            2>&1 | tee target/benchmark-preparation/server-install.log
      - name: Prebuild normal protocol clients and freeze the measured identity
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path tools/http3-probe/Cargo.toml --bins \
            2>&1 | tee target/benchmark-preparation/client-build.log
          .venv/bin/python scripts/run_benchmark_categories.py \
            --uvicorn-python "$UVICORN_ORACLE_PYTHON" \
            --capture-identity target/benchmark-preparation/parity-before.json \
            2>&1 | tee target/benchmark-preparation/freeze.log
          .venv/bin/python - <<'PY'
          import importlib
          import shutil
          from pathlib import Path
          native = Path(importlib.import_module("uvicorn_rs._native").__file__)
          shutil.copyfile(native, Path("target/benchmark-preparation/native-extension.bin"))
          PY
      - name: Gate the exact normal binary on every indexed public parity case
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/run_parity.py \
            --oracle-python "$UVICORN_ORACLE_PYTHON" \
            --installed-candidate \
            --prebuilt-http3-client \
            --output target/benchmark-preparation/parity.json \
            2>&1 | tee target/benchmark-preparation/parity.log
      - name: Summarize exact-binary public parity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def workflow_escape(value):
              return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def error_annotation(title, detail):
              message = " ".join(str(detail).split())[:1000]
              print("::error title={}::{}".format(workflow_escape(title), workflow_escape(message)))

          def case_detail(case):
              difference = case.get("difference")
              if isinstance(difference, str) and difference:
                  return difference
              error = case.get("error")
              if isinstance(error, dict):
                  return "{}: {}".format(error.get("class", "error"), error.get("message", ""))
              if isinstance(error, str) and error:
                  return error
              return "No structured difference was recorded; inspect parity.log and the artifact."

          result_path = Path("target/benchmark-preparation/parity.json")
          lines = ["## Exact-binary public parity"]
          if not result_path.is_file():
              lines.append("No structured parity result was produced.")
              error_annotation("Exact-binary parity report unavailable", "No structured parity result was produced.")
          else:
              try:
                  result = json.loads(result_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  lines.append("The parity result could not be parsed; inspect the retained parity log.")
                  error_annotation("Exact-binary parity report invalid", "The parity result could not be parsed; inspect the retained parity log and artifact.")
              else:
                  summary = result.get("summary", {})
                  lines.append(
                      "Status: `{}`; selected: {}; passed: {}; failed: {}; "
                      "infrastructure failed: {}; not run: {}.".format(
                          result.get("status", "unknown"),
                          summary.get("selected", "unknown"),
                          summary.get("passed", "unknown"),
                          summary.get("failed", "unknown"),
                          summary.get("infrastructure_failed", "unknown"),
                          summary.get("not_run", "unknown"),
                      )
                  )
                  cases = result.get("cases", [])
                  nonpassing = [
                      case for case in cases
                      if isinstance(case, dict) and case.get("status") != "passed"
                  ] if isinstance(cases, list) else []
                  if nonpassing:
                      lines.append("Cases requiring review:")
                      for case in nonpassing[:30]:
                          case_id = case.get("case_id", "unknown")
                          status = case.get("status", "unknown")
                          detail = case_detail(case)
                          lines.append("- `{}`: `{}` — {}".format(case_id, status, " ".join(detail.split())[:500]))
                          error_annotation("ASGI parity {} ({})".format(case_id, status), detail)
                      if len(nonpassing) > 30:
                          lines.append("- {} additional non-passing cases omitted.".format(len(nonpassing) - 30))
                          error_annotation("Additional ASGI parity failures", "{} more non-passing cases are listed in the retained parity artifact.".format(len(nonpassing) - 30))
                  infrastructure_errors = result.get("infrastructure_errors", [])
                  if isinstance(infrastructure_errors, list) and infrastructure_errors:
                      lines.append("Profile-level infrastructure errors:")
                      for error in infrastructure_errors[:30]:
                          if isinstance(error, dict):
                              detail = "{}: {}".format(error.get("kind", "infrastructure error"), error.get("message", ""))
                              lines.append(
                                  "- profile `{}`; kind `{}`; server `{}`".format(
                                      error.get("profile", "unknown"),
                                      error.get("kind", "unknown"),
                                      error.get("server", "unknown"),
                                  )
                              )
                              error_annotation("ASGI parity infrastructure {}".format(error.get("profile", "unknown")), detail)
                      if len(infrastructure_errors) > 30:
                          error_annotation("Additional ASGI parity infrastructure errors", "{} more errors are listed in the retained parity artifact.".format(len(infrastructure_errors) - 30))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY
      - name: Run a FastAPI-only comparison against Uvicorn
        shell: bash
        env:
          BENCHMARK_DURATION: ${{ inputs.duration || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-duration=30]') && '30') || '5' }}
          BENCHMARK_WARMUP: ${{ inputs.warmup || '1' }}
          BENCHMARK_CONCURRENCY: ${{ inputs.concurrency || '64' }}
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '5' }}
          BENCHMARK_SEED: ${{ inputs.seed || '20261005' }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/run_benchmark_categories.py \
            --uvicorn-python "$UVICORN_ORACLE_PYTHON" \
            --parity-before-identity target/benchmark-preparation/parity-before.json \
            --parity-report target/benchmark-preparation/parity.json \
            --output-dir target/fastapi-only \
            --category http1 \
            --workloads fastapi-validated-route fastapi-python-cpu \
            --duration "$BENCHMARK_DURATION" --warmup "$BENCHMARK_WARMUP" \
            --concurrency "$BENCHMARK_CONCURRENCY" --repetitions "$BENCHMARK_REPETITIONS" \
            --seed "$BENCHMARK_SEED" --category-timeout 5400 \
            2>&1 | tee target/benchmark-preparation/fastapi-categories-driver.log
      - name: Run every maintained category sequentially and analyze matching valid repetitions
        shell: bash
        env:
          BENCHMARK_DURATION: ${{ inputs.duration || '5' }}
          BENCHMARK_WARMUP: ${{ inputs.warmup || '1' }}
          BENCHMARK_CONCURRENCY: ${{ inputs.concurrency || '64' }}
          BENCHMARK_H3_CONCURRENCY: ${{ inputs.h3_concurrency || '1' }}
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '5' }}
          BENCHMARK_SEED: ${{ inputs.seed || '20261005' }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/run_benchmark_categories.py \
            --uvicorn-python "$UVICORN_ORACLE_PYTHON" \
            --parity-before-identity target/benchmark-preparation/parity-before.json \
            --parity-report target/benchmark-preparation/parity.json \
            --output-dir target/benchmark-categories \
            --duration "$BENCHMARK_DURATION" --warmup "$BENCHMARK_WARMUP" \
            --concurrency "$BENCHMARK_CONCURRENCY" --repetitions "$BENCHMARK_REPETITIONS" \
            --h3-concurrency "$BENCHMARK_H3_CONCURRENCY" \
            --seed "$BENCHMARK_SEED" --category-timeout 5400 \
            2>&1 | tee target/benchmark-preparation/categories-driver.log
      - name: Retain or recover analysis for an interrupted category run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f target/benchmark-categories/run.json && ! test -f target/benchmark-categories/analysis.json; then
            .venv/bin/python scripts/analyze_benchmark_categories.py --input-dir target/benchmark-categories \
              > target/benchmark-preparation/analysis-recovery.log 2>&1
          fi
          if test -f target/fastapi-only/run.json && ! test -f target/fastapi-only/analysis.json; then
            .venv/bin/python scripts/analyze_benchmark_categories.py --input-dir target/fastapi-only \
              > target/benchmark-preparation/fastapi-analysis-recovery.log 2>&1
          fi
          if test -f target/fastapi-only/analysis.md; then
            cat target/fastapi-only/analysis.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f target/benchmark-categories/analysis.md; then
            cat target/benchmark-categories/analysis.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'No complete benchmark analysis: inspect retained preparation/parity/category logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: asgi-category-benchmarks-${{ matrix.system.id }}
          path: |
            target/benchmark-preparation/
            target/fastapi-only/
            target/benchmark-categories/
          if-no-files-found: warn
          retention-days: 90

  focused-fastapi-stage-diagnostic:
    name: ${{ inputs.fastapi_system || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-system=linux-aarch64]') && 'linux-aarch64') || 'linux-x86_64' }} · ${{ inputs.fastapi_stage_loop || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-loop=uvloop]') && 'uvloop') || 'asyncio' }} · ${{ inputs.fastapi_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-workload=fastapi-upload-1m-write-1k]') && 'fastapi-upload-1m-write-1k') || 'fastapi-validated-route' }} · ${{ inputs.fastapi_stage_repetitions || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-repetitions=3]') && '3') || '1' }}x ${{ inputs.run_mode == 'focused-fastapi-upload-trace' && 'upload trace' || 'matched ASGI stage diagnostic' }} · Tokio ${{ inputs.fastapi_trace_tokio || 'current' }} · Hyper ${{ inputs.fastapi_trace_http_deps == 'historical' && '1.11.1' || 'current' }}
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.run_mode == 'focused-fastapi-stage' || inputs.run_mode == 'focused-fastapi-upload-trace')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[focused-fastapi-stage]')) }}
    runs-on: ${{ (inputs.fastapi_system == 'linux-aarch64' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-system=linux-aarch64]'))) && 'ubuntu-24.04-arm' || inputs.fastapi_system == 'macos-arm64' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Prepare one-workload FastAPI diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation target/fastapi-stage target/fastapi-upload-trace
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcurl4-openssl-dev
            dpkg-query -W build-essential pkg-config libssl-dev libcurl4-openssl-dev > target/benchmark-preparation/system-packages.txt
            lscpu
            lscpu -J > target/benchmark-preparation/lscpu.json
          else
            brew install curl pkg-config openssl@3
            brew_paths="$(brew --prefix curl)/bin:$(brew --prefix openssl@3)/bin"
            echo "$brew_paths" | tr ':' '\n' >> "$GITHUB_PATH"
            export PATH="$brew_paths:$PATH"
            brew list --versions curl pkg-config openssl@3 > target/benchmark-preparation/system-packages.txt
            system_profiler SPHardwareDataType > target/benchmark-preparation/hardware.txt
          fi
          uv sync --python "$PYTHON_VERSION" --group benchmark --group fastapi-benchmark --frozen
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-benchmark-oracle"
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --only-group fastapi-benchmark \
            --no-install-project --frozen
          printf 'UVICORN_ORACLE_PYTHON=%s\n' "$oracle_environment/bin/python" >> "$GITHUB_ENV"
          .venv/bin/python --version | tee target/benchmark-preparation/python-version.txt
          rustc --version --verbose > target/benchmark-preparation/rust-version.txt
          node --version > target/benchmark-preparation/node-version.txt
          cc --version > target/benchmark-preparation/compiler-version.txt
          uname -a > target/benchmark-preparation/uname.txt
      - name: Build Rust runtime diagnostics extension
        shell: bash
        env:
          FASTAPI_TRACE_TOKIO: ${{ inputs.fastapi_trace_tokio || 'current' }}
          FASTAPI_TRACE_HTTP_DEPS: ${{ inputs.fastapi_trace_http_deps || 'current' }}
        run: |
          set -euo pipefail
          if [[ "$FASTAPI_TRACE_HTTP_DEPS" == "historical" ]]; then
            hyper_archive="$RUNNER_TEMP/hyper-1.11.1.crate"
            hyper_source="$RUNNER_TEMP/hyper-1.11.1-source"
            curl --fail --location --silent --show-error \
              --output "$hyper_archive" \
              https://static.crates.io/crates/hyper/hyper-1.11.1.crate
            printf '%s  %s\n' \
              27b501faa50e7a26c3d3560ca625132f4078a17771f4810baf70475ae48cbe43 \
              "$hyper_archive" | sha256sum --check
            printf '%s  %s\n' \
              dd12a3489b2ec46cce2a240403b2f51088964ff9da3ac6b225f005ffccbf42f0 \
              tools/diagnostics/hyper-1.11.1-uvicorn-rs.patch | sha256sum --check
            mkdir -p "$hyper_source"
            tar -xzf "$hyper_archive" -C "$hyper_source" --strip-components=1
            # Keep the workspace's server-facing Hyper patches while replaying
            # the historical upstream version used by the failing run.
            patch --directory="$hyper_source" --strip=1 --fuzz=0 --no-backup-if-mismatch \
              < tools/diagnostics/hyper-1.11.1-uvicorn-rs.patch
            rm -rf crates/uvicorn-rs/third-party/hyper
            mkdir -p crates/uvicorn-rs/third-party/hyper
            cp -a "$hyper_source/." crates/uvicorn-rs/third-party/hyper/
            cargo update --package hyper --precise 1.11.1
            printf '%s\n' \
              'hyper=1.11.1 crates.io archive sha256=27b501faa50e7a26c3d3560ca625132f4078a17771f4810baf70475ae48cbe43' \
              'hyper-workspace-patch sha256=dd12a3489b2ec46cce2a240403b2f51088964ff9da3ac6b225f005ffccbf42f0' \
              'h2 remains the current workspace-patched version; see h2-dependency-tree.txt' \
              > target/benchmark-preparation/historical-transport-dependencies.txt
          fi
          if [[ "$FASTAPI_TRACE_TOKIO" == "1.53.1" ]]; then
            cargo update --package tokio --precise 1.53.1
          fi
          uv run --with maturin==1.14.1 --no-sync maturin develop --release \
            --features runtime-diagnostics \
            2>&1 | tee target/benchmark-preparation/runtime-diagnostics-build.log
          cargo tree --locked -i tokio > target/benchmark-preparation/tokio-dependency-tree.txt
          cargo tree --locked -i hyper > target/benchmark-preparation/hyper-dependency-tree.txt
          cargo tree --locked -i h2 > target/benchmark-preparation/h2-dependency-tree.txt
          if [[ "$FASTAPI_TRACE_TOKIO" == "1.53.1" ]]; then
            grep -Eq 'tokio v1\.53\.1 ' target/benchmark-preparation/tokio-dependency-tree.txt
          fi
          if [[ "$FASTAPI_TRACE_HTTP_DEPS" == "historical" ]]; then
            grep -Eq 'hyper v1\.11\.1 ' target/benchmark-preparation/hyper-dependency-tree.txt
          fi
          cp Cargo.lock target/benchmark-preparation/diagnostic-Cargo.lock
      - name: Capture read-only host preflight
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/benchmark_host_preflight.py \
            --output target/benchmark-preparation/host-preflight.json
      - name: Check lifecycle diagnostics and bounded upload trace tooling without a performance workload
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_mode != 'focused-fastapi-upload-trace' }}
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/test_benchmark_reference_exceptions.py \
            > target/benchmark-preparation/h3-reference-exception-policy.log 2>&1
          .venv/bin/python scripts/test_lifecycle_bench.py \
            > target/benchmark-preparation/lifecycle-diagnostic-contract.log 2>&1
          .venv/bin/python scripts/test_upload_trace.py \
            > target/benchmark-preparation/upload-trace-tooling.log 2>&1
          rustc --edition=2024 --test src/upload_trace.rs \
            -o "$RUNNER_TEMP/uvicorn-rs-upload-trace-tests"
          "$RUNNER_TEMP/uvicorn-rs-upload-trace-tests" \
            >> target/benchmark-preparation/upload-trace-tooling.log 2>&1
      - name: Run one focused FastAPI diagnostic
        shell: bash
        env:
          BENCHMARK_FASTAPI_WORKLOAD: ${{ inputs.fastapi_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-workload=fastapi-upload-1m-write-1k]') && 'fastapi-upload-1m-write-1k') || 'fastapi-validated-route' }}
          BENCHMARK_DURATION: ${{ inputs.duration || '5' }}
          BENCHMARK_WARMUP: ${{ inputs.warmup || '1' }}
          BENCHMARK_CONCURRENCY: ${{ inputs.concurrency || '64' }}
          BENCHMARK_REPETITIONS: ${{ inputs.fastapi_stage_repetitions || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-repetitions=3]') && '3') || '1' }}
          BENCHMARK_SEED: ${{ inputs.seed || '20261019' }}
          BENCHMARK_STAGE_LOOP: ${{ inputs.fastapi_stage_loop || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-loop=uvloop]') && 'uvloop') || 'asyncio' }}
          BENCHMARK_TRACE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'focused-fastapi-upload-trace' }}
          BENCHMARK_TRACE_TIMER: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_trace_timer || 'pinned' }}
          UVICORN_RS_DIAGNOSTIC_PEER_READ_MODE: ${{ inputs.fastapi_peer_read_mode == 'on-read' && 'on-read' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-peer-read=on-read]') && 'on-read') || '' }}
          UVICORN_RS_DIAGNOSTIC_PEER_READ_CHUNK_SIZE: ${{ inputs.fastapi_peer_read_chunk || '64k' }}
          UVICORN_RS_UPLOAD_TRACE: "1"
          UVICORN_RS_UPLOAD_TRACE_REQUESTS: ${{ inputs.upload_trace_requests || '' }}
          UVICORN_RS_HTTP_CLIENT_TCP_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'focused-fastapi-upload-trace' && '1' || '' }}
          # Selected request traces are retained even when they finish quickly.
          UVICORN_RS_UPLOAD_TRACE_MIN_MS: ${{ inputs.upload_trace_requests != '' && '1' || '20' }}
        run: |
          set -euo pipefail
          diagnostic_args=(--require-runtime-diagnostics)
          output_dir=target/fastapi-stage
          if [[ "$BENCHMARK_TRACE_ONLY" == "true" ]]; then
            output_dir=target/fastapi-upload-trace
            if [[ "$BENCHMARK_TRACE_TIMER" == "recreated" ]]; then
              export UVICORN_RS_DIAGNOSTIC_BODY_BATCH_TIMER=recreated
            fi
          else
            diagnostic_args+=(--asgi-stage-diagnostics)
          fi
          mkdir -p "$output_dir"
          .venv/bin/python scripts/run_http_category_bench.py \
            --uvicorn-python "$UVICORN_ORACLE_PYTHON" \
            --workloads "$BENCHMARK_FASTAPI_WORKLOAD" \
            --servers "uvicorn-rs-$BENCHMARK_STAGE_LOOP" "uvicorn-$BENCHMARK_STAGE_LOOP-httptools" \
            --duration "$BENCHMARK_DURATION" --warmup "$BENCHMARK_WARMUP" \
            --concurrency "$BENCHMARK_CONCURRENCY" \
            --repetitions "$BENCHMARK_REPETITIONS" --seed "$BENCHMARK_SEED" \
            "${diagnostic_args[@]}" \
            --output "$output_dir/${BENCHMARK_FASTAPI_WORKLOAD}.json" \
            2>&1 | tee "$output_dir/${BENCHMARK_FASTAPI_WORKLOAD}.log"
      - name: Retain focused FastAPI diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.run_mode == 'focused-fastapi-upload-trace' && 'fastapi-upload-trace' || 'fastapi-stage' }}-${{ inputs.fastapi_system || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-system=linux-aarch64]') && 'linux-aarch64') || 'linux-x86_64' }}-${{ inputs.fastapi_stage_loop || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-loop=uvloop]') && 'uvloop') || 'asyncio' }}-${{ inputs.fastapi_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-workload=fastapi-upload-1m-write-1k]') && 'fastapi-upload-1m-write-1k') || 'fastapi-validated-route' }}-${{ inputs.fastapi_stage_repetitions || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-stage-repetitions=3]') && '3') || '1' }}x-${{ inputs.run_mode == 'focused-fastapi-upload-trace' && inputs.upload_trace_timer || 'stage' }}-tokio-${{ inputs.fastapi_trace_tokio || 'current' }}-hyper-${{ inputs.fastapi_trace_http_deps == 'historical' && '1.11.1' || 'current' }}-${{ github.sha }}
          path: |
            target/benchmark-preparation/
            target/fastapi-stage/
            target/fastapi-upload-trace/
          if-no-files-found: warn
          retention-days: 90

  focused-fastapi-match:
    # Push commits can select one Linux ARM64 upload case when the GitHub
    # workflow-dispatch UI is unavailable to the maintainer.
    name: ${{ inputs.fastapi_system || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-system=linux-aarch64]') && 'linux-aarch64') || 'linux-x86_64' }} · ${{ inputs.run_mode == 'peer-read-comparison' && 'buffer on/off comparison' || inputs.fastapi_workload || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-workload=fastapi-upload-1m-write-1k]') && 'fastapi-upload-1m-write-1k') || 'fastapi-validated-route' }} · normal-build matched timing
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.run_mode == 'focused-fastapi-match' || inputs.run_mode == 'peer-read-comparison')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[focused-fastapi-match]')) }}
    runs-on: ${{ (inputs.fastapi_system == 'linux-aarch64' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-system=linux-aarch64]'))) && 'ubuntu-24.04-arm' || inputs.fastapi_system == 'macos-arm64' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Prepare one-workload normal-build FastAPI environment
        shell: bash
        env:
          BENCHMARK_SYSTEM_ID: ${{ inputs.fastapi_system || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-system=linux-aarch64]') && 'linux-aarch64') || 'linux-x86_64' }}
          BENCHMARK_RUNNER: ${{ (inputs.fastapi_system == 'linux-aarch64' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[fastapi-system=linux-aarch64]'))) && 'ubuntu-24.04-arm' || inputs.fastapi_system == 'macos-arm64' && 'macos-15' || 'ubuntu-24.04' }}
        run: |
          set -euo pipefail
          mkdir -p target/benchmark-preparation target/fastapi-match
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libcurl4-openssl-dev
            dpkg-query -W build-essential pkg-config libssl-dev libcurl4-openssl-dev > target/benchmark-preparation/system-packages.txt
            lscpu -J > target/benchmark-preparation/lscpu.json
            cpu_model="$(lscpu -J | python3 -c 'import json,sys; print(next((item["data"] for item in json.load(sys.stdin)["lscpu"] if item["field"].strip(":") == "Model name"), "unknown"))')"
          else
            brew install curl pkg-config openssl@3
            brew_paths="$(brew --prefix curl)/bin:$(brew --prefix openssl@3)/bin"
            echo "$brew_paths" | tr ':' '\n' >> "$GITHUB_PATH"
            export PATH="$brew_paths:$PATH"
            brew list --versions curl pkg-config openssl@3 > target/benchmark-preparation/system-packages.txt
            system_profiler SPHardwareDataType > target/benchmark-preparation/hardware.txt
            cpu_model="$(sysctl -n machdep.cpu.brand_string)"
          fi
          export BENCHMARK_CPU_MODEL="$cpu_model"
          uv sync --python "$PYTHON_VERSION" --group benchmark --group fastapi-benchmark --frozen --no-install-project
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-benchmark-oracle"
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --only-group fastapi-benchmark \
            --no-install-project --frozen
          printf 'UVICORN_ORACLE_PYTHON=%s\n' "$oracle_environment/bin/python" >> "$GITHUB_ENV"
          .venv/bin/python --version | tee target/benchmark-preparation/python-version.txt
          rustc --version --verbose > target/benchmark-preparation/rust-version.txt
          node --version > target/benchmark-preparation/node-version.txt
          cc --version > target/benchmark-preparation/compiler-version.txt
          curl-config --version > target/benchmark-preparation/curl-version.txt
          openssl version > target/benchmark-preparation/openssl-version.txt
          uname -a > target/benchmark-preparation/uname.txt
          .venv/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import platform
          import psutil
          from pathlib import Path
          names = ("uvloop", "httptools", "psutil", "h11", "fastapi", "starlette", "pydantic")
          report = {
              "system_id": os.environ["BENCHMARK_SYSTEM_ID"],
              "runner_label": os.environ["BENCHMARK_RUNNER"],
              "os": platform.system(),
              "architecture": platform.machine(),
              "cpu_model": os.environ.get("BENCHMARK_CPU_MODEL", "unknown"),
              "logical_cpu_count": os.cpu_count(),
              "physical_cpu_count": psutil.cpu_count(logical=False),
              "memory_total_bytes": psutil.virtual_memory().total,
              "python": platform.python_version(),
              "platform": platform.platform(),
              "packages": {name: metadata.version(name) for name in names},
              "hosted_runner": {name: os.environ.get(name) for name in ("ImageOS", "ImageVersion", "RUNNER_ARCH", "RUNNER_NAME")},
