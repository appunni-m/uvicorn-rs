name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the full CI matrix or selected parity cases on Linux or Windows
        required: true
        type: choice
        default: full
        options:
          - full
          - focused-windows-parity
          - focused-linux-parity
      parity_case_ids:
        description: Comma-separated case IDs for a focused parity mode (up to 20)
        required: false
        type: string
        default: python-api.module-cli-two-workers-serve-request

permissions:
  contents: read

concurrency:
  # Let selected parity runs proceed while the full coverage matrix is active.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.mode || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"
  MSRV_TOOLCHAIN: "1.85.0"
  PYTHON_VERSION: "3.12.13"
  WHEEL_PYTHON_VERSION: "3.12.13"
  UV_VERSION: "0.11.29"
  GUNICORN_VERSION: "23.0.0"
  MATURIN_VERSION: "1.14.1"
  STARLETTE_RS_REVISION: "738c43362938896c268ca29b9a9a2a5942df510c"
  NATIVE_FASTAPI_RS_REVISION: "0afccce9f35447f38ebb5e94d0e67fd338ea7ea4"
  NATIVE_STARLETTE_RS_REVISION: "4139a72449bf5751e8902fb1c7175ee7f191d338"
  RUSTC_WRAPPER: ""
  RUSTC_WORKSPACE_WRAPPER: ""
  RUSTFLAGS: ""
  CARGO_ENCODED_RUSTFLAGS: ""
  # Include client handshake and Uvicorn progress in WSS oracle failures; target behavior is unchanged.
  ASGI_PARITY_UVICORN_WEBSOCKET_DEBUG: "1"

jobs:
  release-evidence-contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    name: Release artifact and Coverage-MCP handoff contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
      - name: Exercise exact-run handoff and fail-closed receipt cases
        run: python scripts/test_coverage_mcp_handoff.py

  rust:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    name: Rust formatting, lints, feature builds and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          # Keep project-written Rust under strict Clippy. The vendored H3
          # protocol follows the upstream lint baseline; its feature-on build
          # is compiled separately below.
          cargo clippy -p asgi-lifespan-protocol-rs --lib --locked -- -D warnings
          cargo clippy -p uvicorn-rs --lib --no-default-features --locked -- -D warnings
          cargo clippy -p uvicorn-rs-py --lib --no-deps --all-features --locked -- -D warnings
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cfg coverage" \
            cargo clippy -p uvicorn-rs --no-deps --all-targets --no-default-features --locked -- -D warnings
          cargo fmt --manifest-path tools/http3-probe/Cargo.toml --all -- --check
          cargo clippy --manifest-path tools/http3-probe/Cargo.toml --no-deps --all-targets --all-features --locked -- -D warnings
      - name: Compile feature modes (behavior is checked through live ASGI cases)
        run: |
          cargo check --lib --locked
          cargo check --lib --no-default-features --locked
          cargo check --lib --all-features --locked
          cargo check -p uvicorn-rs --lib --no-default-features --locked
          cargo check -p uvicorn-rs --lib --features http3 --locked
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cfg coverage" \
            cargo check -p uvicorn-rs --all-targets --features http3 --locked
          cargo check --manifest-path tools/http3-probe/Cargo.toml --bins --locked
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p uvicorn-rs-py --all-features --no-deps --locked
          cargo doc -p uvicorn-rs --no-deps --locked
      - name: Confirm the Rust core has no Python runtime dependency
        run: |
          set -euo pipefail
          mkdir -p target/core-audit
          cargo tree -p uvicorn-rs --edges normal --prefix none > target/core-audit/dependencies.txt
          if grep -Eq '^pyo3(-async-runtimes)? v' target/core-audit/dependencies.txt; then
            echo "uvicorn-rs must not depend on PyO3"
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "could not inspect the uvicorn-rs dependency tree"
              exit "$grep_status"
            fi
          fi
      - name: Run Rust-native HTTP live contract inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-contracts
          python3 scripts/select_native_contracts.py
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cfg coverage" \
            cargo run -p uvicorn-rs --example native_core_contracts --features http3 --locked -- \
            target/native-contracts/normal-inputs.json 2>&1 | tee target/native-contracts/normal-run.log
      - name: Retain native normal-lane inputs, selection and outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uvicorn-rs-native-normal-contracts
          path: target/native-contracts/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  native-framework-composition:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    name: Pinned native FastAPI-RS composition inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Create clean sibling source checkouts
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/native-composition"
          mkdir -p "$workspace/uvicorn-rs" "$workspace/fastapi-rs" "$workspace/starlette-rs"
          git archive --format=tar "$GITHUB_SHA" | tar -x -C "$workspace/uvicorn-rs"

          git init "$workspace/fastapi-rs"
          git -C "$workspace/fastapi-rs" remote add origin https://github.com/appunni-m/fastapi-rs.git
          git -C "$workspace/fastapi-rs" fetch --depth 1 origin "$NATIVE_FASTAPI_RS_REVISION"
          git -C "$workspace/fastapi-rs" checkout --detach FETCH_HEAD
          test "$(git -C "$workspace/fastapi-rs" rev-parse HEAD)" = "$NATIVE_FASTAPI_RS_REVISION"

          git init "$workspace/starlette-rs"
          git -C "$workspace/starlette-rs" remote add origin https://github.com/appunni-m/starlette-rs.git
          git -C "$workspace/starlette-rs" fetch --depth 1 origin "$NATIVE_STARLETTE_RS_REVISION"
          git -C "$workspace/starlette-rs" checkout --detach FETCH_HEAD
          test "$(git -C "$workspace/starlette-rs" rev-parse HEAD)" = "$NATIVE_STARLETTE_RS_REVISION"
          test -z "$(git -C "$workspace/fastapi-rs" status --porcelain)"
          test -z "$(git -C "$workspace/starlette-rs" status --porcelain)"

          printf 'uvicorn-rs=%s\n' "$GITHUB_SHA"
          printf 'fastapi-rs=%s\n' "$(git -C "$workspace/fastapi-rs" rev-parse HEAD)"
          printf 'starlette-rs=%s\n' "$(git -C "$workspace/starlette-rs" rev-parse HEAD)"
      - name: Confirm the integrated native graph excludes PyO3
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/native-composition"
          cargo tree --manifest-path "$workspace/uvicorn-rs/examples/native-fastapi-contracts/Cargo.toml" \
            --locked --edges normal,build --format '{p}' > "$RUNNER_TEMP/native-composition-dependencies.txt"
          if grep -q '^pyo3' "$RUNNER_TEMP/native-composition-dependencies.txt"; then
            cat "$RUNNER_TEMP/native-composition-dependencies.txt"
            echo "native FastAPI composition must not depend on PyO3"
            exit 1
          else
            grep_status=$?
            if [[ "$grep_status" -ne 1 ]]; then
              echo "could not verify the native FastAPI dependency graph (grep exited $grep_status)" >&2
              exit "$grep_status"
            fi
          fi
      - name: Run native FastAPI-RS → Starlette-RS → Uvicorn-RS live inputs
        # The pinned Starlette-RS revision has a Linux-only `unused_mut` lint
        # in a macOS-specific stat branch. The uvicorn-rs workspace has its
        # own warning-denied Clippy gate above; cap dependency lint levels only
        # for this integration smoke so upstream warnings do not mask runtime
        # composition failures. The workflow-wide empty CARGO_ENCODED_RUSTFLAGS
        # takes precedence over RUSTFLAGS in Cargo, so unset it for this command.
        env:
          RUSTFLAGS: --cap-lints warn
        run: |
          workspace="$RUNNER_TEMP/native-composition"
          env -u CARGO_ENCODED_RUSTFLAGS CARGO_TARGET_DIR="$RUNNER_TEMP/native-composition-target" \
            cargo run --manifest-path "$workspace/uvicorn-rs/examples/native-fastapi-contracts/Cargo.toml" \
            --locked -- "$workspace/uvicorn-rs/examples/native-fastapi-contracts/manifest.json"

  msrv:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    name: Compile the exact Rust minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable action
        with:
          toolchain: ${{ env.MSRV_TOOLCHAIN }}
      - run: |
          cargo check --lib --locked
          cargo check --lib --no-default-features --locked
          cargo check --lib --all-features --locked
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cfg coverage" \
            cargo check -p uvicorn-rs --all-targets --features http3 --locked

  python-package:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    name: Complete public parity on the installed normal wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build candidate wheel and prepare an isolated Uvicorn oracle
        shell: bash
        run: |
          set -euo pipefail
          uv sync --python "$PYTHON_VERSION" --group benchmark --extra standard --frozen --no-install-project
          uvx --from "maturin==$MATURIN_VERSION" maturin build --release --locked --interpreter "$GITHUB_WORKSPACE/.venv/bin/python" --out target/normal-wheels
          wheels=(target/normal-wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python .venv/bin/python --no-deps "${wheels[0]}"
          uv pip install --python .venv/bin/python "gunicorn==$GUNICORN_VERSION"
          .venv/bin/python scripts/check_installed_wheel.py --wheel "${wheels[0]}" --output target/asgi-parity/wheel-consumer.json
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-uvicorn-oracle"
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --no-install-project --frozen
          uv pip install --python "$oracle_environment/bin/python" "gunicorn==$GUNICORN_VERSION"
      - name: Compare the installed wheel with Uvicorn on upstream Starlette
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/asgi-parity
          starlette_log=target/asgi-parity/starlette.log
          set +e
          (
            set -euo pipefail
            environment="$RUNNER_TEMP/uvicorn-rs-starlette"
            UV_PROJECT_ENVIRONMENT="$environment" uv sync --python "$PYTHON_VERSION" \
              --only-group benchmark --only-group fastapi-benchmark --no-install-project --frozen
            wheel="$(find target/normal-wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
            test -n "$wheel"
            uv pip install --python "$environment/bin/python" \
              "starlette==1.6.0" "$wheel"
            oracle_environment="$RUNNER_TEMP/uvicorn-rs-starlette-oracle"
            UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$PYTHON_VERSION" \
              --only-group benchmark --only-group uvicorn-oracle --only-group fastapi-benchmark --no-install-project --frozen
            "$environment/bin/python" scripts/probe_starlette_rs.py \
              --framework starlette --server-wheel "$wheel" \
              --oracle-python "$oracle_environment/bin/python" \
              --output target/asgi-parity/starlette.json
          ) >"$starlette_log" 2>&1
          starlette_status=$?
          set -e
          if [ "$starlette_status" -ne 0 ]; then
            python - "$starlette_log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-30:])[-3000:]
          detail = detail.encode("ascii", "backslashreplace").decode("ascii")
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Upstream Starlette integration failure::{encoded}")
          PY
            exit "$starlette_status"
          fi
          tail -n 5 "$starlette_log"
      - name: Compare the exact wheel with both Starlette frameworks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/asgi-parity
          framework_log=target/asgi-parity/starlette-rs-integration.log
          set +e
          bash -euo pipefail >"$framework_log" 2>&1 <<'BASH'
          framework_dir="$RUNNER_TEMP/starlette-rs"
          framework_target="$RUNNER_TEMP/starlette-rs-cargo-target"
          framework_wheels="$RUNNER_TEMP/starlette-rs-wheels"
          framework_env="$RUNNER_TEMP/uvicorn-rs-starlette-rs"
          oracle_env="$RUNNER_TEMP/uvicorn-rs-starlette-rs-oracle"
          mkdir -p "$framework_wheels"
          git init "$framework_dir"
          git -C "$framework_dir" remote add origin https://github.com/appunni-m/starlette-rs.git
          git -C "$framework_dir" fetch --depth 1 origin "$STARLETTE_RS_REVISION"
          git -C "$framework_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$framework_dir" rev-parse HEAD)" = "$STARLETTE_RS_REVISION"
          UV_PROJECT_ENVIRONMENT="$framework_env" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --no-install-project --frozen
          (
            cd "$framework_dir"
            env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cap-lints warn" \
              RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" CARGO_TARGET_DIR="$framework_target" \
              uvx --from "maturin==$MATURIN_VERSION" maturin build --release --locked \
                --interpreter "$framework_env/bin/python" --out "$framework_wheels"
          )
          server_wheel="$(find target/normal-wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          framework_wheel="$(find "$framework_wheels" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$server_wheel"
          test -n "$framework_wheel"
          uv pip install --python "$framework_env/bin/python" \
            "$server_wheel" "$framework_wheel"
          UV_PROJECT_ENVIRONMENT="$oracle_env" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --no-install-project --frozen
          uv pip install --python "$oracle_env/bin/python" \
            "$framework_wheel"
          "$framework_env/bin/python" scripts/probe_starlette_rs.py \
            --framework starlette-rs --server-wheel "$server_wheel" \
            --framework-wheel "$framework_wheel" \
            --oracle-python "$oracle_env/bin/python" \
            --output target/asgi-parity/starlette-rs.json
          .venv/bin/python scripts/compare_framework_receipts.py \
            --starlette target/asgi-parity/starlette.json \
            --starlette-rs target/asgi-parity/starlette-rs.json \
            --output target/asgi-parity/framework-comparison.json
          BASH
          framework_status=$?
          set -e
          if [ "$framework_status" -ne 0 ]; then
            .venv/bin/python - "$framework_log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-30:])[-3000:]
          detail = detail.encode("ascii", "backslashreplace").decode("ascii")
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=.github/workflows/ci.yml,line=126,title=Starlette integration failure::{encoded}")
          PY
            exit "$framework_status"
          fi
          tail -n 5 "$framework_log"
      - name: Stop the exact installed wheel through a transient systemd service
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find target/normal-wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          systemd_log=target/asgi-parity/systemd-deployment.log
          set +e
          .venv/bin/python scripts/probe_systemd_deployment.py \
            --wheel "$wheel" --output target/asgi-parity/systemd.json \
            >"$systemd_log" 2>&1
          systemd_status=$?
          set -e
          if [ "$systemd_status" -ne 0 ]; then
            .venv/bin/python - "$systemd_log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-30:])[-3000:]
          detail = detail.encode("ascii", "backslashreplace").decode("ascii")
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=.github/workflows/ci.yml,line=157,title=systemd deployment probe failure::{encoded}")
          PY
            exit "$systemd_status"
          fi
          tail -n 5 "$systemd_log"
      - name: Execute complete current public input matrix
        id: public_parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/asgi-parity
          .venv/bin/python scripts/run_parity.py \
            --oracle-python "$RUNNER_TEMP/uvicorn-rs-uvicorn-oracle/bin/python" \
            --installed-candidate \
            --output target/asgi-parity/result.json 2>&1 | tee target/asgi-parity/run.log
          .venv/bin/python scripts/check_ci_evidence.py parity \
            target/asgi-parity/result.json --offline --require-clean
      - name: Trace the Hypercorn HTTP/3 case after a public parity failure
        if: ${{ failure() && steps.public_parity.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/run_parity.py \
            --oracle-python "$RUNNER_TEMP/uvicorn-rs-uvicorn-oracle/bin/python" \
            --installed-candidate \
            --case-id http3.early-response-with-open-upload \
            --trace-hypercorn-h3-events \
            --output target/asgi-parity/h3-early-response-diagnostic.json \
            2>&1 | tee target/asgi-parity/h3-early-response-diagnostic.log
      - name: Verify normal fault-seam exclusion with existing public cases
        run: >-
          .venv/bin/python scripts/audit_normal_build.py
          --oracle-python "$RUNNER_TEMP/uvicorn-rs-uvicorn-oracle/bin/python"
          --output-dir target/normal-audit
      - name: Summarize public parity
        if: always()
        run: python scripts/summarize_parity_result.py target/asgi-parity/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uvicorn-rs-public-parity
          path: |
            target/asgi-parity/
            target/normal-wheels/*.whl
            target/normal-audit/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  unified-coverage:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    name: All parity and fault contracts, 100% native regions and lines
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked references and pinned coverage tools
        run: |
          uv sync --python "$PYTHON_VERSION" --group benchmark --extra standard --frozen
          uv pip install --python .venv/bin/python "gunicorn==$GUNICORN_VERSION"
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Prepare the isolated stock Uvicorn oracle
        run: |
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-coverage-oracle"
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --no-install-project --frozen
          uv pip install --python "$oracle_environment/bin/python" "gunicorn==$GUNICORN_VERSION"
      - name: Attribute every indexed case and repeat the complete matrix three times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/asgi-coverage
          .venv/bin/python scripts/run_unified_coverage.py \
            --oracle-python "$RUNNER_TEMP/uvicorn-rs-coverage-oracle/bin/python" \
            --output target/asgi-coverage/coverage-report.json \
            --artifacts-dir target/asgi-coverage/artifacts \
            --matrix-repeats 3 --case-infra-retries 0 --matrix-infra-retries 0 \
            2>&1 | tee target/asgi-coverage/run.log
          .venv/bin/python scripts/check_ci_evidence.py coverage \
            target/asgi-coverage/coverage-report.json --allow-pending-mcp
      - name: Summarize unified coverage diagnostics
        if: always()
        continue-on-error: true
        run: |
          python scripts/summarize_unified_coverage.py \
            --report target/asgi-coverage/coverage-report.json \
            --log target/asgi-coverage/run.log
      - name: Record exact workflow run identity in the coverage artifact
        if: always()
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p target/asgi-coverage
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = {
              "schema": "uvicorn-rs-ci-artifact-identity@1",
              "workflow_path": ".github/workflows/ci.yml",
              "run_id": int(os.environ["CI_RUN_ID"]),
              "run_attempt": int(os.environ["CI_RUN_ATTEMPT"]),
              "head_sha": os.environ["CI_HEAD_SHA"],
          }
          Path("target/asgi-coverage/ci-run.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uvicorn-rs-unified-coverage
          path: |
            target/asgi-coverage/coverage-report.json
            target/asgi-coverage/coverage-report.json.context.json
            target/asgi-coverage/ci-run.json
            target/asgi-coverage/run.log
            target/asgi-coverage/artifacts/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  release-candidate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    name: Build and verify ${{ matrix.platform }} package artifacts
    # Platform builds and their installed-wheel parity are independent evidence.
    # Run them beside unified coverage; the candidate/release handoff still
    # requires this entire CI run to succeed, including the coverage gate.
    needs: [rust, msrv, python-package, release-evidence-contracts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows checkout must handle the retained, deeply nested parity evidence
    # paths before any ordinary setup step can configure Git.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Linux'
        with:
          python-version: ${{ env.WHEEL_PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: runner.os != 'Linux'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.WHEEL_PYTHON_VERSION }}
          enable-cache: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: runner.os == 'Linux'
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install and resolve the exact managed Python for macOS and Windows
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          uv python install --managed-python "$WHEEL_PYTHON_VERSION"
          interpreter="$(uv python find --managed-python "$WHEEL_PYTHON_VERSION")"
          if [ "$RUNNER_OS" = 'Windows' ]; then
            interpreter="$(cygpath --unix "$interpreter")"
          fi
          echo "WHEEL_PYTHON=$interpreter" >> "$GITHUB_ENV"
      - name: Resolve the hosted Python on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: echo "WHEEL_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verify release metadata
        shell: bash
        run: |
          "$WHEEL_PYTHON" scripts/check_release_version.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os == 'Linux'
        with:
          name: uvicorn-rs-public-parity
          path: target/public-parity
      - name: Build abi3 wheel and install the exact artifact
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/uvicorn-rs-wheel-consumer.log"
          set +e
          (
            set -euo pipefail
            mkdir -p dist
            if [ "$RUNNER_OS" = 'Linux' ]; then
              wheels=(target/public-parity/normal-wheels/*.whl)
              test "${#wheels[@]}" -eq 1
              test -s target/public-parity/asgi-parity/result.json
              cp "${wheels[0]}" dist/
              cp target/public-parity/asgi-parity/result.json dist/parity-linux-x86_64.json
            else
              uvx --from "maturin==$MATURIN_VERSION" maturin build \
                --release --locked --interpreter "$WHEEL_PYTHON" --out dist
            fi
            wheels=(dist/*.whl)
            test "${#wheels[@]}" -eq 1
            "$WHEEL_PYTHON" scripts/check_replacement_install.py --wheel "${wheels[0]}"
            if [ "$RUNNER_OS" = 'Linux' ]; then
              cp target/public-parity/asgi-parity/wheel-consumer.json dist/consumer-linux-x86_64.json
            else
              consumer_environment="$RUNNER_TEMP/uvicorn-rs-artifact-consumer"
              UV_PROJECT_ENVIRONMENT="$consumer_environment" uv sync \
                --python "$WHEEL_PYTHON_VERSION" \
                --group benchmark --extra standard --no-install-project --frozen
              if [ "$RUNNER_OS" = 'Windows' ]; then
                consumer_python="$consumer_environment/Scripts/python.exe"
              else
                consumer_python="$consumer_environment/bin/python"
              fi
              uv pip install --python "$consumer_python" --no-deps "${wheels[0]}"
              "$consumer_python" scripts/check_installed_wheel.py --wheel "${wheels[0]}" --output dist/consumer-${{ matrix.platform }}.json
            fi
          ) >"$log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            "$WHEEL_PYTHON" - "$log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-30:])[-3000:]
          detail = detail.encode("ascii", "backslashreplace").decode("ascii")
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Package wheel build or consumer failure::{encoded}")
          PY
            cat "$log"
            exit "$status"
          fi
          cat "$log"
      - name: Run all indexed platform-applicable parity inputs on the ${{ matrix.platform }} candidate wheel
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          candidate_environment="$RUNNER_TEMP/uvicorn-rs-candidate-parity"
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-upstream-oracle"
          UV_PROJECT_ENVIRONMENT="$candidate_environment" uv sync \
            --python "$WHEEL_PYTHON_VERSION" \
            --group benchmark --extra standard --no-install-project --frozen
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync \
            --python "$WHEEL_PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle \
            --no-install-project --frozen
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          if [ "$RUNNER_OS" = 'Windows' ]; then
            candidate_python="$candidate_environment/Scripts/python.exe"
            oracle_python="$oracle_environment/Scripts/python.exe"
          else
            candidate_python="$candidate_environment/bin/python"
            oracle_python="$oracle_environment/bin/python"
            uv pip install --python "$candidate_python" "gunicorn==$GUNICORN_VERSION"
            uv pip install --python "$oracle_python" "gunicorn==$GUNICORN_VERSION"
          fi
          uv pip install --python "$candidate_python" --no-deps "${wheels[0]}"
          parity_args=()
          if [ "$RUNNER_OS" = 'Windows' ]; then
            # These inputs require Unix-domain sockets, inherited POSIX
            # descriptors, a Unix-only transfer race, or POSIX-only signals.
            parity_args+=(
              --exclude-case-id python-api.module-cli-posix-unresponsive-worker-healthcheck-restarts
              --exclude-case-id python-api.module-cli-inherited-fd-from-uvicorn-environment
              --exclude-case-id python-api.module-cli-serves-request-on-inherited-fd
              --exclude-case-id python-api.module-cli-serves-request-on-inherited-ipv6-fd
              --exclude-case-id python-api.module-cli-two-workers-serves-inherited-ipv6-fd-request
              --exclude-case-id python-api.module-cli-two-workers-serves-inherited-fd-request
              --exclude-case-id python-api.server-serves-request-on-prebound-socket
              --exclude-case-id python-api.server-serves-request-on-multiple-prebound-sockets
              --exclude-case-id python-api.server-serves-request-on-multiple-prebound-tls-sockets
              --exclude-case-id python-api.server-sockets-serves-request-on-multiple-inherited-fds
              --exclude-case-id python-api.config-server-serves-request-on-inherited-fd
              --exclude-case-id python-api.run-serves-request-on-inherited-fd
              --exclude-case-id python-api.server-startup-honors-preexisting-exit-request
              --exclude-case-id cli.invalid-file-descriptor-is-rejected
              --exclude-case-id python-api.run-websocket-over-unix-domain-socket
              --exclude-case-id python-api.server-startup-uds-replaces-existing-socket-and-shuts-down-lifespan
              --exclude-case-id python-api.run-applies-concurrency-limit-unix-socket
              --exclude-case-id python-api.module-cli-serves-unix-domain-socket-request
              --exclude-case-id python-api.config-server-serves-unix-domain-socket-request
              --exclude-case-id python-api.module-cli-serves-tls-over-unix-domain-socket
              --exclude-case-id python-api.cancel-startup-during-prebound-listener-transfer
              --exclude-case-id python-api.cancel-startup-during-prebound-transfer-without-lifespan
              --exclude-case-id cli.uds-startup-and-clean-exit
              --exclude-case-id cli.uds-from-environment-starts-and-cleans
              --exclude-case-id python-api.module-cli-two-workers-scale-with-ttin-ttou
              --exclude-case-id python-api.module-cli-two-workers-restart-on-sighup
              --exclude-case-id python-api.module-cli-sighup-keeps-workers-after-replacement-startup-failure
            )
          fi
          run_platform_parity() {
            "$candidate_python" scripts/run_parity.py \
              --oracle-python "$oracle_python" \
              --installed-candidate "$@" \
              --output "target/parity-${{ matrix.platform }}.json"
            "$candidate_python" scripts/check_ci_evidence.py parity \
              "target/parity-${{ matrix.platform }}.json" \
              --offline --require-clean "$@"
          }
          if [ "$RUNNER_OS" = 'Windows' ]; then
            run_platform_parity "${parity_args[@]}"
          else
            run_platform_parity
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && runner.os != 'Linux'
        with:
          name: uvicorn-rs-platform-parity-${{ matrix.platform }}
          path: |
            target/parity-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 90
      - name: Build source distribution
        if: runner.os == 'Linux'
        run: uvx --from "maturin==$MATURIN_VERSION" maturin sdist --out dist
      - name: Rebuild extracted source archive and consume its wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sdists=(dist/*.tar.gz)
          test "${#sdists[@]}" -eq 1
          python scripts/check_sdist_build.py --sdist "${sdists[0]}" --output-dir target/sdist-consumer
          cp target/sdist-consumer/result.json dist/consumer-sdist.json
      - name: Package the Python-free server and shared lifecycle contract
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: target/native-package
        run: |
          set -euo pipefail
          cargo package -p asgi-lifespan-protocol-rs --no-verify --locked --offline
          cargo package -p uvicorn-rs --no-verify --locked \
            --config 'patch.crates-io.asgi-lifespan-protocol-rs.path="crates/asgi-lifespan-protocol-rs"'
          packages=(target/native-package/package/*.crate)
          test "${#packages[@]}" -eq 2
          cp "${packages[@]}" dist/
      - name: Revalidate the reused exact-source Linux parity receipt
        if: runner.os == 'Linux'
        run: python scripts/check_ci_evidence.py parity dist/parity-linux-x86_64.json --offline --require-clean
      - name: Record source, build, license and artifact identities
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/uvicorn-rs-release-evidence.log"
          set +e
          python scripts/release_evidence.py record --directory dist \
            --platform ${{ matrix.platform }} --commit "${{ github.sha }}" \
            --output dist/build-manifest-${{ matrix.platform }}.json >"$log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python - "$log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-80:])[-5000:]
          detail = detail.encode("ascii", "backslashreplace").decode("ascii")
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Release evidence recording failure::{encoded}")
          PY
            cat "$log"
            exit "$status"
          fi
          cat "$log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uvicorn-rs-candidate-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  python-floor:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    name: Install abi3 wheel on the declared Python floor
    needs: release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9.25"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uvicorn-rs-candidate-linux-x86_64
          path: target/python-floor
      - name: Check the exact installed wheel with Python 3.9
        shell: bash
        run: |
          set -euo pipefail
          wheels=(target/python-floor/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install --disable-pip-version-check --no-input --no-deps "${wheels[0]}"
          python scripts/check_installed_wheel.py --wheel "${wheels[0]}" --output target/python-floor/consumer-python39.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uvicorn-rs-python-floor
          path: target/python-floor/consumer-python39.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  focused-windows-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'focused-windows-parity'
    name: Selected Windows parity cases
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build and run only the selected Windows cases
        shell: bash
        env:
          PARITY_CASE_IDS: ${{ inputs.parity_case_ids }}
          UVICORN_RS_SHUTDOWN_TRACE: "1"
          UVICORN_RS_SHUTDOWN_TRACE_OUTPUT: target/focused-windows/shutdown-trace.log
        run: |
          set -euo pipefail
          uv sync --python "$PYTHON_VERSION" --group benchmark --extra standard \
            --no-install-project --frozen
          wheel_python="$(uv python find --managed-python "$PYTHON_VERSION")"
          wheel_python="$(cygpath --unix "$wheel_python")"
          mkdir -p target/focused-windows/wheels
          uvx --from "maturin==$MATURIN_VERSION" maturin build --release --locked \
            --interpreter "$wheel_python" --out target/focused-windows/wheels
          wheels=(target/focused-windows/wheels/*.whl)
          test "${#wheels[@]}" -eq 1

          candidate_environment="$RUNNER_TEMP/uvicorn-rs-focused-candidate"
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-focused-oracle"
          UV_PROJECT_ENVIRONMENT="$candidate_environment" uv sync \
            --python "$PYTHON_VERSION" --group benchmark --extra standard \
            --no-install-project --frozen
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync \
            --python "$PYTHON_VERSION" --only-group benchmark \
            --only-group uvicorn-oracle --no-install-project --frozen

          candidate_python="$candidate_environment/Scripts/python.exe"
          oracle_python="$oracle_environment/Scripts/python.exe"
          uv pip install --python "$candidate_python" --no-deps "${wheels[0]}"

          IFS=',' read -r -a case_ids <<< "$PARITY_CASE_IDS"
          if (( ${#case_ids[@]} == 0 || ${#case_ids[@]} > 20 )); then
            echo "Select between 1 and 20 case IDs" >&2
            exit 2
          fi
          parity_args=()
          for case_id in "${case_ids[@]}"; do
            case_id="${case_id#"${case_id%%[![:space:]]*}"}"
            case_id="${case_id%"${case_id##*[![:space:]]}"}"
            if [[ ! "$case_id" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
              echo "Invalid parity case ID: $case_id" >&2
              exit 2
            fi
            parity_args+=(--case-id "$case_id")
          done
          mkdir -p target/focused-windows
          "$candidate_python" scripts/run_parity.py \
            --oracle-python "$oracle_python" \
            --installed-candidate \
            "${parity_args[@]}" \
            --output target/focused-windows/parity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uvicorn-rs-focused-windows-parity
          path: target/focused-windows/
          if-no-files-found: error
          retention-days: 30

  focused-linux-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'focused-linux-parity'
    name: Selected Linux parity cases
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build and run only the selected Linux cases
        shell: bash
        env:
          PARITY_CASE_IDS: ${{ inputs.parity_case_ids }}
          UVICORN_RS_SHUTDOWN_TRACE: "1"
          UVICORN_RS_SHUTDOWN_TRACE_OUTPUT: target/focused-linux/shutdown-trace.log
        run: |
          set -euo pipefail
          uv sync --python "$PYTHON_VERSION" --group benchmark --extra standard \
            --no-install-project --frozen
          mkdir -p target/focused-linux/wheels
          uvx --from "maturin==$MATURIN_VERSION" maturin build --release --locked \
            --interpreter .venv/bin/python --out target/focused-linux/wheels
          wheels=(target/focused-linux/wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python .venv/bin/python --no-deps "${wheels[0]}"
          .venv/bin/python scripts/check_installed_wheel.py \
            --wheel "${wheels[0]}" --output target/focused-linux/wheel-consumer.json

          oracle_environment="$RUNNER_TEMP/uvicorn-rs-focused-linux-oracle"
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync \
            --python "$PYTHON_VERSION" --only-group benchmark \
            --only-group uvicorn-oracle --no-install-project --frozen
          oracle_python="$oracle_environment/bin/python"

          IFS=',' read -r -a case_ids <<< "$PARITY_CASE_IDS"
          if (( ${#case_ids[@]} == 0 || ${#case_ids[@]} > 20 )); then
            echo "Select between 1 and 20 case IDs" >&2
            exit 2
          fi
          parity_args=()
          for case_id in "${case_ids[@]}"; do
            case_id="${case_id#"${case_id%%[![:space:]]*}"}"
            case_id="${case_id%"${case_id##*[![:space:]]}"}"
            if [[ ! "$case_id" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
              echo "Invalid parity case ID: $case_id" >&2
              exit 2
            fi
            parity_args+=(--case-id "$case_id")
          done
          .venv/bin/python scripts/run_parity.py \
            --oracle-python "$oracle_python" \
            --installed-candidate \
            "${parity_args[@]}" \
            --output target/focused-linux/parity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uvicorn-rs-focused-linux-parity
          path: target/focused-linux/
          if-no-files-found: error
          retention-days: 30
