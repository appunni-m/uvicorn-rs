name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"
  PYTHON_VERSION: "3.12.13"
  # Last Python 3.12 patch with official macOS ARM64 and Windows binaries.
  WHEEL_PYTHON_VERSION: "3.12.10"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-targets --all-features --locked
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p uvicorn-rs --no-deps --locked
      - name: Check HTTP/3 probe formatting
        run: cargo fmt --manifest-path tools/http3-probe/Cargo.toml --all -- --check
      - name: Lint HTTP/3 probe
        run: cargo clippy --manifest-path tools/http3-probe/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Test HTTP/3 probe
        run: cargo test --manifest-path tools/http3-probe/Cargo.toml --all-targets --all-features --locked

  python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build the editable project environment
        run: uv sync --python $PYTHON_VERSION --group benchmark --frozen
      - name: Check CLI import and help
        run: uv run uvicorn-rs --help
      - name: Validate parity contracts and result accounting
        run: uv run python -m unittest discover -s tests -p 'test_parity_*.py'
      - name: Compare ASGI protocol behavior with live reference servers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/asgi-parity
          uv run --group benchmark python scripts/run_parity.py \
            --output target/asgi-parity/result.json 2>&1 \
            | tee target/asgi-parity/run.log
      - name: Summarize ASGI parity failures
        if: always()
        run: python scripts/summarize_parity_result.py target/asgi-parity/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: asgi-parity-${{ github.run_id }}
          path: target/asgi-parity/
          if-no-files-found: warn
          retention-days: 30
      - name: Probe HTTP and ASGI callable behavior
        run: uv run python scripts/probe_http.py
      - name: Probe HTTP/2 and HTTP/3
        run: uv run python scripts/probe_http2.py
      - name: Probe request and response streaming
        run: uv run python scripts/probe_streaming.py
      - name: Probe WebSockets
        run: uv run python scripts/probe_websocket.py
      - name: Probe cancellation and disconnect
        run: uv run python scripts/probe_cancellation.py
      - name: Probe lifespan and shutdown
        run: uv run python scripts/probe_lifespan.py

  release-candidate:
    name: Build and smoke-test ${{ matrix.platform }} artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.WHEEL_PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install pinned Maturin build frontend
        run: python -m pip install --disable-pip-version-check --no-input maturin==1.14.0
      - name: Verify package and lockfile versions
        run: python scripts/check_release_version.py
      - name: Build the abi3 wheel
        run: maturin build --release --locked --interpreter python --out dist
      - name: Install and smoke-test the built wheel
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-deps --no-index --find-links dist "uvicorn-rs==0.1.0"
          python -c 'import uvicorn_rs; import uvicorn_rs._native; print(uvicorn_rs.__file__)'
          uvicorn-rs --help
      - name: Build the source distribution
        if: runner.os == 'Linux'
        run: maturin sdist --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uvicorn-rs-candidate-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
