name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"
  MSRV_TOOLCHAIN: "1.85.0"
  PYTHON_VERSION: "3.12.13"
  WHEEL_PYTHON_VERSION: "3.12.10"
  UV_VERSION: "0.11.29"
  MATURIN_VERSION: "1.14.1"
  STARLETTE_RS_REVISION: "738c43362938896c268ca29b9a9a2a5942df510c"
  NATIVE_FASTAPI_RS_REVISION: "f438a7cbb2308e6c1f795aef98e333de23388533"
  NATIVE_STARLETTE_RS_REVISION: "b4c8a65c85e1b0d251ca05874412811eaa3ac7b8"
  RUSTC_WRAPPER: ""
  RUSTC_WORKSPACE_WRAPPER: ""
  RUSTFLAGS: ""
  CARGO_ENCODED_RUSTFLAGS: ""
  # Include client handshake and Uvicorn progress in WSS oracle failures; target behavior is unchanged.
  ASGI_PARITY_UVICORN_WEBSOCKET_DEBUG: "1"

jobs:
  rust:
    name: Rust formatting, lints, feature builds and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          # Keep strict Clippy on project-owned Rust crates. The maintained H3
          # forks retain upstream code with an existing Clippy baseline; Cargo
          # still compiles them as dependencies, and their protocol behavior is
          # checked by the focused black-box parity cases.
          cargo clippy --workspace --exclude uvicorn-rs-h3 --exclude uvicorn-rs-h3-quinn --no-deps --lib --all-features --locked -- -D warnings
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cfg coverage" \
            cargo clippy -p uvicorn-rs --no-deps --all-targets --all-features --locked -- -D warnings
          cargo fmt --manifest-path tools/http3-probe/Cargo.toml --all -- --check
          cargo clippy --manifest-path tools/http3-probe/Cargo.toml --no-deps --all-targets --all-features --locked -- -D warnings
      - name: Compile feature modes (behavior is checked through live ASGI cases)
        run: |
          cargo check --lib --locked
          cargo check --lib --no-default-features --locked
          cargo check --lib --all-features --locked
          cargo check -p uvicorn-rs-h3 --lib --all-features --locked
          cargo check -p uvicorn-rs-h3-quinn --lib --all-features --locked
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cfg coverage" \
            cargo check -p uvicorn-rs --all-targets --locked
          cargo check --manifest-path tools/http3-probe/Cargo.toml --bins --locked
      - name: Build Rust API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p uvicorn-rs-py --all-features --no-deps --locked
          cargo doc -p uvicorn-rs --no-deps --locked
      - name: Confirm the Rust core has no Python runtime dependency
        run: |
          set -euo pipefail
          mkdir -p target/core-audit
          cargo tree -p uvicorn-rs --edges normal --prefix none > target/core-audit/dependencies.txt
          if rg -q '^pyo3(-async-runtimes)? v' target/core-audit/dependencies.txt; then
            echo "uvicorn-rs must not depend on PyO3"
            exit 1
          fi
      - name: Run Rust-native HTTP live contract inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-contracts
          python3 scripts/select_native_contracts.py
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cfg coverage" \
            cargo run -p uvicorn-rs --example native_core_contracts --locked -- \
            target/native-contracts/normal-inputs.json 2>&1 | tee target/native-contracts/normal-run.log
      - name: Retain native normal-lane inputs, selection and outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uvicorn-rs-native-normal-contracts
          path: target/native-contracts/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  native-framework-composition:
    name: Pinned native FastAPI-RS composition inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable action
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Create clean sibling source checkouts
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/native-composition"
          mkdir -p "$workspace/uvicorn-rs" "$workspace/fastapi-rs" "$workspace/starlette-rs"
          git archive --format=tar "$GITHUB_SHA" | tar -x -C "$workspace/uvicorn-rs"

          git init "$workspace/fastapi-rs"
          git -C "$workspace/fastapi-rs" remote add origin https://github.com/appunni-m/fastapi-rs.git
          git -C "$workspace/fastapi-rs" fetch --depth 1 origin refs/heads/codex/native-fastapi-core
          git -C "$workspace/fastapi-rs" checkout --detach FETCH_HEAD
          test "$(git -C "$workspace/fastapi-rs" rev-parse HEAD)" = "$NATIVE_FASTAPI_RS_REVISION"

          git init "$workspace/starlette-rs"
          git -C "$workspace/starlette-rs" remote add origin https://github.com/appunni-m/starlette-rs.git
          git -C "$workspace/starlette-rs" fetch --depth 1 origin "$NATIVE_STARLETTE_RS_REVISION"
          git -C "$workspace/starlette-rs" checkout --detach FETCH_HEAD
          test "$(git -C "$workspace/starlette-rs" rev-parse HEAD)" = "$NATIVE_STARLETTE_RS_REVISION"
          test -z "$(git -C "$workspace/fastapi-rs" status --porcelain)"
          test -z "$(git -C "$workspace/starlette-rs" status --porcelain)"

          printf 'uvicorn-rs=%s\n' "$GITHUB_SHA"
          printf 'fastapi-rs=%s\n' "$(git -C "$workspace/fastapi-rs" rev-parse HEAD)"
          printf 'starlette-rs=%s\n' "$(git -C "$workspace/starlette-rs" rev-parse HEAD)"
      - name: Confirm the integrated native graph excludes PyO3
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/native-composition"
          cargo tree --manifest-path "$workspace/uvicorn-rs/examples/native-fastapi-contracts/Cargo.toml" \
            --locked --edges normal,build --format '{p}' > "$RUNNER_TEMP/native-composition-dependencies.txt"
          if grep -q '^pyo3' "$RUNNER_TEMP/native-composition-dependencies.txt"; then
            cat "$RUNNER_TEMP/native-composition-dependencies.txt"
            echo "native FastAPI composition must not depend on PyO3"
            exit 1
          else
            grep_status=$?
            if [[ "$grep_status" -ne 1 ]]; then
              echo "could not verify the native FastAPI dependency graph (grep exited $grep_status)" >&2
              exit "$grep_status"
            fi
          fi
      - name: Run native FastAPI-RS → Starlette-RS → Uvicorn-RS live inputs
        # The pinned Starlette-RS revision has a Linux-only `unused_mut` lint
        # in a macOS-specific stat branch. The uvicorn-rs workspace has its
        # own warning-denied Clippy gate above; cap dependency lint levels only
        # for this integration smoke so upstream warnings do not mask runtime
        # composition failures. The workflow-wide empty CARGO_ENCODED_RUSTFLAGS
        # takes precedence over RUSTFLAGS in Cargo, so unset it for this command.
        env:
          RUSTFLAGS: --cap-lints warn
        run: |
          workspace="$RUNNER_TEMP/native-composition"
          env -u CARGO_ENCODED_RUSTFLAGS CARGO_TARGET_DIR="$RUNNER_TEMP/native-composition-target" \
            cargo run --manifest-path "$workspace/uvicorn-rs/examples/native-fastapi-contracts/Cargo.toml" \
            --locked -- "$workspace/uvicorn-rs/examples/native-fastapi-contracts/manifest.json"

  msrv:
    name: Compile the exact Rust minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # reviewed stable action
        with:
          toolchain: ${{ env.MSRV_TOOLCHAIN }}
      - run: |
          cargo check --lib --locked
          cargo check --lib --no-default-features --locked
          cargo check --lib --all-features --locked
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cfg coverage" \
            cargo check -p uvicorn-rs --all-targets --locked

  python-package:
    name: Complete public parity on the installed normal wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build candidate wheel and prepare an isolated Uvicorn oracle
        shell: bash
        run: |
          set -euo pipefail
          uv sync --python "$PYTHON_VERSION" --group benchmark --frozen --no-install-project
          uvx --from "maturin==$MATURIN_VERSION" maturin build --release --locked --interpreter "$GITHUB_WORKSPACE/.venv/bin/python" --out target/normal-wheels
          wheels=(target/normal-wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python .venv/bin/python --no-deps "${wheels[0]}"
          .venv/bin/python scripts/check_installed_wheel.py --wheel "${wheels[0]}" --output target/asgi-parity/wheel-consumer.json
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-uvicorn-oracle"
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --no-install-project --frozen
      - name: Compare the installed wheel with Uvicorn on upstream Starlette
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/asgi-parity
          starlette_log=target/asgi-parity/starlette.log
          set +e
          (
            set -euo pipefail
            environment="$RUNNER_TEMP/uvicorn-rs-starlette"
            UV_PROJECT_ENVIRONMENT="$environment" uv sync --python "$PYTHON_VERSION" \
              --only-group benchmark --only-group fastapi-benchmark --no-install-project --frozen
            wheel="$(find target/normal-wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
            test -n "$wheel"
            uv pip install --python "$environment/bin/python" \
              "starlette==1.6.0" "$wheel"
            oracle_environment="$RUNNER_TEMP/uvicorn-rs-starlette-oracle"
            UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$PYTHON_VERSION" \
              --only-group benchmark --only-group uvicorn-oracle --only-group fastapi-benchmark --no-install-project --frozen
            "$environment/bin/python" scripts/probe_starlette_rs.py \
              --framework starlette --server-wheel "$wheel" \
              --oracle-python "$oracle_environment/bin/python" \
              --output target/asgi-parity/starlette.json
          ) >"$starlette_log" 2>&1
          starlette_status=$?
          set -e
          if [ "$starlette_status" -ne 0 ]; then
            python - "$starlette_log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-30:])[-3000:]
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Upstream Starlette integration failure::{encoded}")
          PY
            exit "$starlette_status"
          fi
          tail -n 5 "$starlette_log"
      - name: Compare the exact wheel with both Starlette frameworks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/asgi-parity
          framework_log=target/asgi-parity/starlette-rs-integration.log
          set +e
          bash -euo pipefail >"$framework_log" 2>&1 <<'BASH'
          framework_dir="$RUNNER_TEMP/starlette-rs"
          framework_target="$RUNNER_TEMP/starlette-rs-cargo-target"
          framework_wheels="$RUNNER_TEMP/starlette-rs-wheels"
          framework_env="$RUNNER_TEMP/uvicorn-rs-starlette-rs"
          oracle_env="$RUNNER_TEMP/uvicorn-rs-starlette-rs-oracle"
          mkdir -p "$framework_wheels"
          git init "$framework_dir"
          git -C "$framework_dir" remote add origin https://github.com/appunni-m/starlette-rs.git
          git -C "$framework_dir" fetch --depth 1 origin "$STARLETTE_RS_REVISION"
          git -C "$framework_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$framework_dir" rev-parse HEAD)" = "$STARLETTE_RS_REVISION"
          UV_PROJECT_ENVIRONMENT="$framework_env" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --no-install-project --frozen
          (
            cd "$framework_dir"
            env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS="--cap-lints warn" \
              RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" CARGO_TARGET_DIR="$framework_target" \
              uvx --from "maturin==$MATURIN_VERSION" maturin build --release --locked \
                --interpreter "$framework_env/bin/python" --out "$framework_wheels"
          )
          server_wheel="$(find target/normal-wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          framework_wheel="$(find "$framework_wheels" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$server_wheel"
          test -n "$framework_wheel"
          uv pip install --python "$framework_env/bin/python" \
            "$server_wheel" "$framework_wheel"
          UV_PROJECT_ENVIRONMENT="$oracle_env" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --no-install-project --frozen
          uv pip install --python "$oracle_env/bin/python" \
            "$framework_wheel"
          "$framework_env/bin/python" scripts/probe_starlette_rs.py \
            --framework starlette-rs --server-wheel "$server_wheel" \
            --framework-wheel "$framework_wheel" \
            --oracle-python "$oracle_env/bin/python" \
            --output target/asgi-parity/starlette-rs.json
          .venv/bin/python scripts/compare_framework_receipts.py \
            --starlette target/asgi-parity/starlette.json \
            --starlette-rs target/asgi-parity/starlette-rs.json \
            --output target/asgi-parity/framework-comparison.json
          BASH
          framework_status=$?
          set -e
          if [ "$framework_status" -ne 0 ]; then
            .venv/bin/python - "$framework_log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-30:])[-3000:]
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=.github/workflows/ci.yml,line=126,title=Starlette integration failure::{encoded}")
          PY
            exit "$framework_status"
          fi
          tail -n 5 "$framework_log"
      - name: Stop the exact installed wheel through a transient systemd service
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find target/normal-wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          systemd_log=target/asgi-parity/systemd-deployment.log
          set +e
          .venv/bin/python scripts/probe_systemd_deployment.py \
            --wheel "$wheel" --output target/asgi-parity/systemd.json \
            >"$systemd_log" 2>&1
          systemd_status=$?
          set -e
          if [ "$systemd_status" -ne 0 ]; then
            .venv/bin/python - "$systemd_log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-30:])[-3000:]
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=.github/workflows/ci.yml,line=157,title=systemd deployment probe failure::{encoded}")
          PY
            exit "$systemd_status"
          fi
          tail -n 5 "$systemd_log"
      - name: Execute complete current public input matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/asgi-parity
          .venv/bin/python scripts/run_parity.py \
            --oracle-python "$RUNNER_TEMP/uvicorn-rs-uvicorn-oracle/bin/python" \
            --output target/asgi-parity/result.json 2>&1 | tee target/asgi-parity/run.log
          .venv/bin/python scripts/check_ci_evidence.py parity target/asgi-parity/result.json
      - name: Verify normal fault-seam exclusion with existing public cases
        run: >-
          .venv/bin/python scripts/audit_normal_build.py
          --oracle-python "$RUNNER_TEMP/uvicorn-rs-uvicorn-oracle/bin/python"
          --output-dir target/normal-audit
      - name: Summarize public parity
        if: always()
        run: python scripts/summarize_parity_result.py target/asgi-parity/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uvicorn-rs-public-parity
          path: |
            target/asgi-parity/
            target/normal-audit/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  unified-coverage:
    name: All parity and fault contracts, 100% native regions and lines
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked references and pinned coverage tools
        run: |
          uv sync --python "$PYTHON_VERSION" --group benchmark --frozen
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Prepare the isolated stock Uvicorn oracle
        run: |
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-coverage-oracle"
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --no-install-project --frozen
      - name: Attribute every indexed case and repeat the complete matrix three times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/asgi-coverage
          .venv/bin/python scripts/run_unified_coverage.py \
            --oracle-python "$RUNNER_TEMP/uvicorn-rs-coverage-oracle/bin/python" \
            --output target/asgi-coverage/coverage-report.json \
            --artifacts-dir target/asgi-coverage/artifacts \
            --matrix-repeats 3 --case-infra-retries 0 --matrix-infra-retries 0 \
            2>&1 | tee target/asgi-coverage/run.log
          .venv/bin/python scripts/check_ci_evidence.py coverage \
            target/asgi-coverage/coverage-report.json --allow-pending-mcp
      - name: Summarize unified coverage diagnostics
        if: always()
        continue-on-error: true
        run: |
          python scripts/summarize_unified_coverage.py \
            --report target/asgi-coverage/coverage-report.json \
            --log target/asgi-coverage/run.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uvicorn-rs-unified-coverage
          path: |
            target/asgi-coverage/coverage-report.json
            target/asgi-coverage/coverage-report.json.context.json
            target/asgi-coverage/run.log
            target/asgi-coverage/artifacts/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  release-candidate:
    name: Build and verify ${{ matrix.platform }} package artifacts
    needs: [rust, msrv, python-package, unified-coverage]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows checkout must handle the retained, deeply nested parity evidence
    # paths before any ordinary setup step can configure Git.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.WHEEL_PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install pinned build frontend and verify metadata
        run: |
          python -m pip install --disable-pip-version-check --no-input maturin==${{ env.MATURIN_VERSION }}
          python scripts/check_release_version.py
      - name: Build abi3 wheel and install the exact artifact
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/uvicorn-rs-wheel-consumer.log"
          set +e
          (
            set -euo pipefail
            maturin build --release --locked --interpreter python --out dist
            wheels=(dist/*.whl)
            test "${#wheels[@]}" -eq 1
            python scripts/check_replacement_install.py --wheel "${wheels[0]}"
            python -m pip install --disable-pip-version-check --no-input --no-deps "${wheels[0]}"
            python scripts/check_installed_wheel.py --wheel "${wheels[0]}" --output dist/consumer-${{ matrix.platform }}.json
          ) >"$log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python - "$log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-30:])[-3000:]
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Package wheel build or consumer failure::{encoded}")
          PY
            cat "$log"
            exit "$status"
          fi
          cat "$log"
      - name: Build source distribution
        if: runner.os == 'Linux'
        run: maturin sdist --out dist
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: runner.os == 'Linux'
        with:
          version: ${{ env.UV_VERSION }}
      - name: Rebuild extracted source archive and consume its wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sdists=(dist/*.tar.gz)
          test "${#sdists[@]}" -eq 1
          python scripts/check_sdist_build.py --sdist "${sdists[0]}" --output-dir target/sdist-consumer
          cp target/sdist-consumer/result.json dist/consumer-sdist.json
      - name: Package the Python-free server, shared lifecycle, and HTTP/3 crates
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: target/native-package
        run: |
          set -euo pipefail
          cargo package -p native-app-contract --no-verify --locked --offline
          cargo package -p uvicorn-rs-h3 --no-verify --locked --offline
          cargo package -p uvicorn-rs-h3-quinn --no-verify --locked --offline \
            --config 'patch.crates-io.uvicorn-rs-h3.path="crates/uvicorn-rs-h3"'
          cargo package -p uvicorn-rs --no-verify --locked --offline \
            --config 'patch.crates-io.native-app-contract.path="crates/native-app-contract"' \
            --config 'patch.crates-io.uvicorn-rs-h3.path="crates/uvicorn-rs-h3"' \
            --config 'patch.crates-io.uvicorn-rs-h3-quinn.path="crates/uvicorn-rs-h3-quinn"'
          packages=(target/native-package/package/*.crate)
          test "${#packages[@]}" -eq 4
          cp "${packages[@]}" dist/
      - name: Run complete public parity on the exact Linux candidate wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --python "$WHEEL_PYTHON_VERSION" --group benchmark --frozen --no-install-project
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv pip install --python .venv/bin/python --no-deps "${wheels[0]}"
          oracle_environment="$RUNNER_TEMP/uvicorn-rs-release-oracle"
          UV_PROJECT_ENVIRONMENT="$oracle_environment" uv sync --python "$WHEEL_PYTHON_VERSION" \
            --only-group benchmark --only-group uvicorn-oracle --no-install-project --frozen
          .venv/bin/python scripts/run_parity.py \
            --oracle-python "$oracle_environment/bin/python" \
            --output dist/parity-linux-x86_64.json
          .venv/bin/python scripts/check_ci_evidence.py parity dist/parity-linux-x86_64.json
      - name: Record source, build, license and artifact identities
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/uvicorn-rs-release-evidence.log"
          set +e
          python scripts/release_evidence.py record --directory dist \
            --platform ${{ matrix.platform }} --commit "${{ github.sha }}" \
            --output dist/build-manifest-${{ matrix.platform }}.json >"$log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python - "$log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          detail = "\n".join(lines[-80:])[-5000:]
          encoded = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Release evidence recording failure::{encoded}")
          PY
            cat "$log"
            exit "$status"
          fi
          cat "$log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uvicorn-rs-candidate-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  python-floor:
    name: Install abi3 wheel on the declared Python floor
    needs: release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9.25"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uvicorn-rs-candidate-linux-x86_64
          path: target/python-floor
      - name: Check the exact installed wheel with Python 3.9
        shell: bash
        run: |
          set -euo pipefail
          wheels=(target/python-floor/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install --disable-pip-version-check --no-input --no-deps "${wheels[0]}"
          python scripts/check_installed_wheel.py --wheel "${wheels[0]}" --output target/python-floor/consumer-python39.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uvicorn-rs-python-floor
          path: target/python-floor/consumer-python39.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
