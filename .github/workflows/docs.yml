name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.in"
      - "requirements-docs.txt"
      - "scripts/select_benchmark_docs.py"
      - "scripts/update_benchmark_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.in"
      - "requirements-docs.txt"
      - "scripts/select_benchmark_docs.py"
      - "scripts/update_benchmark_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

  workflow_run:
    workflows: [ASGI performance matrix]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: documentation-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    name: Build and validate the documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      stale_benchmark_event: ${{ steps.benchmark.outputs.stale }}
    permissions:
      actions: read
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install the hash-locked documentation tools
        run: python -m pip install --require-hashes --requirement requirements-docs.txt
      - name: Select the triggering or latest main benchmark artifact
        id: benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python scripts/select_benchmark_docs.py --output "$GITHUB_OUTPUT"
      - name: Download the selected main benchmark aggregate
        if: steps.benchmark.outputs.found == 'true' && steps.benchmark.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.benchmark.outputs.run-id }}
          artifact-ids: ${{ steps.benchmark.outputs.artifact-id }}
          digest-mismatch: error
          path: target/benchmark-matrix/aggregate
      - name: Render the selected benchmark snapshot into the docs build
        if: steps.benchmark.outputs.found == 'true'
        env:
          BENCHMARK_RUN_ID: ${{ steps.benchmark.outputs.run-id }}
          BENCHMARK_RUN_ATTEMPT: ${{ steps.benchmark.outputs.run-attempt }}
          BENCHMARK_COMMIT: ${{ steps.benchmark.outputs.commit }}
          BENCHMARK_CONCLUSION: ${{ steps.benchmark.outputs.conclusion }}
          BENCHMARK_ARTIFACT_ID: ${{ steps.benchmark.outputs.artifact-id }}
          BENCHMARK_ARTIFACT_DIGEST: ${{ steps.benchmark.outputs.artifact-digest }}
        run: >-
          python scripts/update_benchmark_docs.py
          --repository "$GITHUB_REPOSITORY"
          --run-id "$BENCHMARK_RUN_ID"
          --run-attempt "$BENCHMARK_RUN_ATTEMPT"
          --commit "$BENCHMARK_COMMIT"
          --conclusion "$BENCHMARK_CONCLUSION"
          --artifact-id "$BENCHMARK_ARTIFACT_ID"
          --artifact-digest "$BENCHMARK_ARTIFACT_DIGEST"
          --aggregate-directory target/benchmark-matrix/aggregate
      - name: Build and validate every maintained documentation page
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  deploy:
    name: Deploy the validated site
    needs: build
    if: >-
      needs.build.outputs.stale_benchmark_event != 'true' &&
      ((github.ref == 'refs/heads/main' && github.event_name == 'push') ||
       (github.event_name == 'workflow_run' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
