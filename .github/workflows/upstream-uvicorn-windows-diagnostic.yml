name: Upstream Uvicorn Windows diagnostic

on:
  workflow_dispatch:
    inputs:
      windows_runner:
        description: Windows image for the stock Uvicorn reproduction
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-2025

permissions:
  contents: read

concurrency:
  group: upstream-uvicorn-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.13"
  UV_VERSION: "0.11.29"

jobs:
  reproduce:
    name: Reproduce stock Uvicorn worker shutdown behavior
    runs-on: ${{ inputs.windows_runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install only stock Uvicorn and its minimal diagnostic dependencies
        id: stock-install
        shell: bash
        run: |
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/stock-uvicorn"
          uv pip install --python "$RUNNER_TEMP/stock-uvicorn/Scripts/python.exe" \
            uvicorn==0.54.0 click==8.5.0 h11==0.16.0 colorama==0.4.6 py-spy==0.4.3
      - name: Isolate one ready worker's terminate operation
        shell: bash
        working-directory: tools/upstream/uvicorn-windows
        run: '"$RUNNER_TEMP/stock-uvicorn/Scripts/python.exe" worker_terminate.py --output ../../../target/stock-windows/worker-terminate.json'
      - name: Capture the two-worker Ctrl+C hang within ten attempts
        if: always() && !cancelled() && steps.stock-install.conclusion == 'success'
        shell: bash
        working-directory: tools/upstream/uvicorn-windows
        run: '"$RUNNER_TEMP/stock-uvicorn/Scripts/python.exe" cli_ctrl_c.py --output ../../../target/stock-windows/cli-ctrl-c --attempts 10 --dump-exe "$RUNNER_TEMP/stock-uvicorn/Scripts/py-spy.exe"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: uvicorn-stock-windows-worker-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/stock-windows/
          if-no-files-found: warn
          retention-days: 90
